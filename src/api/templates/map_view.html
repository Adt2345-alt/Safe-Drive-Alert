            metaKey: { color: '#9CA3AF' },
            labelBox: {
                position: 'absolute', transform: 'translate(-50%, -100%)', background: 'rgba(11, 15, 25, 0.92)',
                border: '1px solid', borderRadius: '4px', padding: '3px 8px', fontSize: '10px',
                fontFamily: 'Orbitron', color: '#E5E7EB', zIndex: 120, pointerEvents: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.5)'
            },
            measureNotice: {
                position: 'absolute', bottom: '14px', left: '12px', background: 'rgba(11, 15, 25, 0.92)',
                border: '1px solid #00F2FE', borderRadius: '8px', padding: '8px 14px', fontSize: '11px',
                fontFamily: 'Orbitron', color: '#E5E7EB', zIndex: 120
            },
            comparePanel: {
                position: 'absolute', bottom: '14px', right: '12px', background: 'rgba(11, 15, 25, 0.92)',
                border: '1px solid #f59e0b', borderRadius: '8px', padding: '10px 14px', fontSize: '11px',
                maxWidth: '280px', zIndex: 120
            }
        };

        // --- MAIN MAP VIEW COMPONENT ---
        function MainMapView() {
            const [defects, setDefects] = useState([]);
            const [filteredDefects, setFilteredDefects] = useState([]);
            const [selectedDefect, setSelectedDefect] = useState(null);
            const [showTwinModal, setShowTwinModal] = useState(false);
            const [activeTwinDefectId, setActiveTwinDefectId] = useState(null);
            const [zoomLevel, setZoomLevel] = useState(13.5);

            // Financial Cost & Savings State
            const [showSavingsModal, setShowSavingsModal] = useState(false);
            const [costSummary, setCostSummary] = useState(null);
            const [selectedCostData, setSelectedCostData] = useState(null);

            // Region Detection State
            const [regionsList, setRegionsList] = useState([]);
            const [selectedRegion, setSelectedRegion] = useState('PRIMARY');

            // Fetch cost summary on component mount
            useEffect(() => {
                fetch('/api/costs/summary?region=Bangalore')
                    .then(res => res.json())
                    .then(data => setCostSummary(data))
                    .catch(err => console.error("Error fetching cost summary:", err));
            }, []);

            // Fetch selected defect cost breakdown when selectedDefect changes
            useEffect(() => {
                if (!selectedDefect) {
                    setSelectedCostData(null);
                    return;
                }
                const rawId = selectedDefect.raw_id || selectedDefect.id;
                const numericId = typeof rawId === 'number' ? rawId : parseInt(String(rawId).replace('DEF-', ''), 10);
                if (numericId && !isNaN(numericId)) {
                    fetch(`/api/defects/${numericId}/cost`)
                        .then(res => res.json())
                        .then(data => setSelectedCostData(data))
                        .catch(err => console.error("Error fetching defect cost:", err));
                }
            }, [selectedDefect]);

            const [layersConfig, setLayersConfig] = useState({
                baseMap: true,
                defects: true,
                heatmap: false,
                trajectory: false,
                municipality: false,
                coverage: false
            });

            const [filterSeverity, setFilterSeverity] = useState('ALL');
            const [filterType, setFilterType] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');

            const [kpiStats, setKpiStats] = useState({ total: 0, critical: 0, high: 0, medium: 0, low: 0, repaired: 0 });

            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const mapMarkersRef = useRef([]);
            const popupRef = useRef(null);

            // 1. Fetch Defects Data from SQLite database & Detect Regions
            useEffect(() => {
                fetch('/api/map/defects?limit=10000')
                    .then(res => res.json())
                    .then(data => {
                        const rawDefects = data.defects || [];

                        // Group defects into geographic regions
                        const regionMap = {};
                        rawDefects.forEach(d => {
                            if (!d.lat || !d.lng || (d.lat === 0 && d.lng === 0)) return;
                            let key = 'Other';
                            let name = 'Other Region';

                            if (d.lat >= 8.0 && d.lat <= 30.0 && d.lng >= 68.0 && d.lng <= 90.0) {
                                key = 'bangalore';
                                name = 'Bangalore';
                            } else if (d.lat >= 30.0 && d.lat <= 50.0 && d.lng >= -130.0 && d.lng <= -110.0) {
                                key = 'sf';
                                name = 'San Francisco';
                            } else {
                                const roundedLat = d.lat.toFixed(1);
                                const roundedLng = d.lng.toFixed(1);
                                key = `reg_${roundedLat}_${roundedLng}`;
                                name = `Region (${roundedLat}, ${roundedLng})`;
                            }

                            if (!regionMap[key]) {
                                regionMap[key] = {
                                    key,
                                    name,
                                    count: 0,
                                    defects: [],
                                    minLat: d.lat,
                                    maxLat: d.lat,
                                    minLng: d.lng,
                                    maxLng: d.lng
                                };
                            }
                            const r = regionMap[key];
                            r.count++;
                            r.defects.push(d);
                            r.minLat = Math.min(r.minLat, d.lat);
                            r.maxLat = Math.max(r.maxLat, d.lat);
                            r.minLng = Math.min(r.minLng, d.lng);
                            r.maxLng = Math.max(r.maxLng, d.lng);
                        });

                        const list = Object.values(regionMap).sort((a, b) => b.count - a.count);
                        setRegionsList(list);

                        // Default to densest region (Bangalore)
                        if (list.length > 0) {
                            setSelectedRegion(list[0].key);
                        }

                        setDefects(rawDefects);
                    })
                    .catch(err => console.error("Error fetching defects from DB:", err));
            }, []);

            // 2. MapLibre GL JS Basemap Initialization with Ultra-Smooth Controls
            useEffect(() => {
                if (!mapContainerRef.current || mapInstanceRef.current) return;
                if (!window.maplibregl) return;

                const map = new window.maplibregl.Map({
                    container: mapContainerRef.current,
                    style: 'https://tiles.openfreemap.org/styles/dark',
                    center: [77.5946, 12.9716], // Bangalore center
                    zoom: 12.5,
                    pitch: 35,
                    bearing: 0,
                    attributionControl: false,
                    dragRotate: true,
                    touchZoomRotate: true,
                    scrollZoom: { speed: 0.05, smooth: true },
                    fadeDuration: 200
                });

                map.addControl(new window.maplibregl.AttributionControl({
                    compact: true,
                    customAttribution: 'MAP DATA © OpenStreetMap contributors, © OpenFreeMap'
                }), 'bottom-right');

                map.addControl(new window.maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

                map.on('zoom', () => {
                    const currentZoom = map.getZoom();
                    setZoomLevel(Math.round(currentZoom * 10) / 10);
                    
                    // Toggle visibility of DOM markers vs cluster circles based on zoom 12 threshold
                    mapMarkersRef.current.forEach(m => {
                        const el = m.getElement();
                        if (el) {
                            el.style.display = currentZoom >= 12.0 ? 'block' : 'none';
                        }
                    });
                });

                mapInstanceRef.current = map;

                return () => {
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                    }
                };
            }, []);

            // 3. Filter Defects & Update KPIs based on Region, Severity, Type, and Search
            useEffect(() => {
                let filtered = defects.filter(d => {
                    if (selectedRegion !== 'ALL') {
                        const activeReg = regionsList.find(r => r.key === selectedRegion) || regionsList[0];
                        if (activeReg && !activeReg.defects.some(rd => (rd.id === d.id || rd.raw_id === d.raw_id))) return false;
                    }
                    if (filterSeverity !== 'ALL' && d.severity !== filterSeverity) return false;
                    if (filterType !== 'ALL' && d.type !== filterType) return false;
                    if (searchQuery.trim() !== '') {
                        const q = searchQuery.toLowerCase();
                        const matchId = String(d.id).toLowerCase().includes(q) || (d.formatted_id && d.formatted_id.toLowerCase().includes(q));
                        const matchCorridor = d.corridor ? d.corridor.toLowerCase().includes(q) : false;
                        if (!matchId && !matchCorridor) return false;
                    }
                    return true;
                });

                setFilteredDefects(filtered);

                const stats = { total: filtered.length, critical: 0, high: 0, medium: 0, low: 0, repaired: 0 };
                filtered.forEach(d => {
                    if (d.repair_status === 'Repaired') stats.repaired++;
                    else if (d.severity === 'Critical') stats.critical++;
                    else if (d.severity === 'High') stats.high++;
                    else if (d.severity === 'Medium') stats.medium++;
                    else if (d.severity === 'Low') stats.low++;
                });
                setKpiStats(stats);
            }, [defects, selectedRegion, filterSeverity, filterType, searchQuery, regionsList]);

            // Helper to Focus Map on Region
            const focusRegion = (regKey) => {
                if (!mapInstanceRef.current || !window.maplibregl) return;
                if (regKey === 'ALL') {
                    if (defects.length === 0) return;
                    const bounds = new window.maplibregl.LngLatBounds();
                    defects.forEach(d => { if (d.lat && d.lng) bounds.extend([d.lng, d.lat]); });
                    mapInstanceRef.current.fitBounds(bounds, { padding: 80, maxZoom: 14 });
                } else {
                    const regObj = regionsList.find(r => r.key === regKey);
                    if (regObj) {
                        const padLat = Math.max((regObj.maxLat - regObj.minLat) * 0.2, 0.008);
                        const padLng = Math.max((regObj.maxLng - regObj.minLng) * 0.2, 0.008);
                        const bounds = [
                            [regObj.minLng - padLng, regObj.minLat - padLat],
                            [regObj.maxLng + padLng, regObj.maxLat + padLat]
                        ];
                        mapInstanceRef.current.fitBounds(bounds, { padding: 80, maxZoom: 14 });
                    }
                }
            };

            // Focus map whenever selectedRegion changes
            useEffect(() => {
                if (selectedRegion && regionsList.length > 0) {
                    focusRegion(selectedRegion);
                }
            }, [selectedRegion, regionsList]);

            // 4. Render Markers & Setup MapLibre Clustering below zoom 12
            useEffect(() => {
                if (!mapInstanceRef.current || !window.maplibregl) return;
                const map = mapInstanceRef.current;

                // Clear previous DOM markers
                mapMarkersRef.current.forEach(m => m.remove());
                mapMarkersRef.current = [];

                if (!layersConfig.defects || filteredDefects.length === 0) return;

                // Build GeoJSON collection for MapLibre Clustering
                const geojson = {
                    type: 'FeatureCollection',
                    features: filteredDefects.filter(d => d.lat && d.lng && d.lat !== 0).map(d => ({
                        type: 'Feature',
                        properties: {
                            id: d.id,
                            raw_id: d.raw_id,
                            severity: d.severity,
                            depth_cm: d.depth_cm,
                            type: d.type
                        },
                        geometry: {
                            type: 'Point',
                            coordinates: [d.lng, d.lat]
                        }
                    }))
                };

                const updateClusters = () => {
                    if (map.getSource('defects-cluster-src')) {
                        map.getSource('defects-cluster-src').setData(geojson);
                    } else {
                        map.addSource('defects-cluster-src', {
                            type: 'geojson',
                            data: geojson,
                            cluster: true,
                            clusterMaxZoom: 11, // Cluster below zoom 12
                            clusterRadius: 50
                        });

                        map.addLayer({
                            id: 'clusters',
                            type: 'circle',
                            source: 'defects-cluster-src',
                            filter: ['has', 'point_count'],
                            paint: {
                                'circle-color': [
                                    'step',
                                    ['get', 'point_count'],
                                    '#00F2FE',
                                    15, '#f59e0b',
                                    40, '#ef4444'
                                ],
                                'circle-radius': [
                                    'step',
                                    ['get', 'point_count'],
                                    16,
                                    15, 22,
                                    40, 28
                                ],
                                'circle-stroke-width': 2,
                                'circle-stroke-color': '#ffffff'
                            }
                        });

                        map.addLayer({
                            id: 'cluster-count',
                            type: 'symbol',
                            source: 'defects-cluster-src',
                            filter: ['has', 'point_count'],
                            layout: {
                                'text-field': '{point_count_abbreviated}',
                                'text-size': 13,
                                'text-allow-overlap': true
                            },
                            paint: {
                                'text-color': '#0B0F19'
                            }
                        });

                        // Ultra-fast WebGL Unclustered Point Layer (Renders 10,000 points at 60 FPS on GPU)
                        map.addLayer({
                            id: 'unclustered-point',
                            type: 'circle',
                            source: 'defects-cluster-src',
                            filter: ['!', ['has', 'point_count']],
                            paint: {
                                'circle-color': [
                                    'match',
                                    ['get', 'severity'],
                                    'Critical', '#ef4444',
                                    'High', '#f59e0b',
                                    'Medium', '#eab308',
                                    '#3b82f6'
                                ],
                                'circle-radius': 6,
                                'circle-stroke-width': 1.5,
                                'circle-stroke-color': '#ffffff'
                            }
                        });

                        map.on('click', 'unclustered-point', (e) => {
                            if (e.features.length > 0) {
                                const props = e.features[0].properties;
                                const targetDefect = filteredDefects.find(d => d.id === props.id || d.raw_id === props.raw_id);
                                if (targetDefect) {
                                    setSelectedDefect(targetDefect);
                                }
                            }
                        });

                        map.on('click', 'clusters', (e) => {
                            const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
                            if (features.length > 0) {
                                const clusterId = features[0].properties.cluster_id;
                                map.getSource('defects-cluster-src').getClusterExpansionZoom(clusterId, (err, zoom) => {
                                    if (!err) {
                                        map.easeTo({ center: features[0].geometry.coordinates, zoom: zoom });
                                    }
                                });
                            }
                        });
                    }
                };

                if (map.isStyleLoaded()) {
                    updateClusters();
                } else {
                    map.once('load', updateClusters);
                }

                const currentZoom = map.getZoom();

                // Cap interactive DOM markers to top 150 most critical items for zero DOM lag
                filteredDefects.slice(0, 150).forEach(d => {
                    if (!d.lat || !d.lng || (d.lat === 0 && d.lng === 0)) return;

                    const isSelected = selectedDefect && (selectedDefect.id === d.id || selectedDefect.raw_id === d.raw_id);
                    const color = SEVERITY_COLORS[d.severity] || SEVERITY_COLORS.Low;
                    const depthVal = d.depth_cm || 5.0;
                    
                    const dotSize = Math.max(6, Math.min(8 + depthVal * 0.3, 14));

                    const el = document.createElement('div');
                    el.className = 'map-defect-marker';
                    el.style.width = `${dotSize}px`;
                    el.style.height = `${dotSize}px`;
                    el.style.borderRadius = '50%';
                    el.style.backgroundColor = color;
                    el.style.border = '2px solid #ffffff';
                    el.style.boxShadow = isSelected ? `0 0 20px ${color}, 0 0 0 4px #00F2FE` : `0 0 10px ${color}`;
                    el.style.cursor = 'pointer';
                    el.style.transition = 'transform 0.15s ease, box-shadow 0.15s ease';
                    el.style.display = currentZoom >= 12.0 ? 'block' : 'none';

                    // Hover Tooltip content
                    const dateStr = d.timestamp ? new Date(d.timestamp * 1000).toLocaleDateString() : 'Recorded';
                    const tooltipHtml = `
                        <div style="font-family: Inter, sans-serif; font-size: 11px; padding: 6px 10px; color: #E5E7EB; background: #0B0F19; border: 1px solid #00F2FE; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,0.8); line-height: 1.4;">
                            <div style="font-family: Orbitron; color: #00F2FE; font-weight: bold; font-size: 11px; margin-bottom: 2px;">
                                ${d.formatted_id || `DEF-${String(d.id).padStart(5, '0')}`} | ${(d.type || 'DEFECT').toUpperCase()}
                            </div>
                            <div>Severity: <b style="color: ${color};">${d.severity || 'Medium'}</b></div>
                            <div>Depth: <b>${d.depth_cm || 5} cm</b> | GPS: <span>${d.lat.toFixed(4)}, ${d.lng.toFixed(4)}</span></div>
                            <div style="color: #9CA3AF; font-size: 10px; margin-top: 3px;">Date: ${dateStr}</div>
                        </div>
                    `;

                    const popup = new window.maplibregl.Popup({ offset: 12, closeButton: false, closeOnClick: false })
                        .setHTML(tooltipHtml);

                    const marker = new window.maplibregl.Marker({ element: el })
                        .setLngLat([d.lng, d.lat])
                        .addTo(mapInstanceRef.current);

                    // Hover events for instant tooltip
                    el.addEventListener('mouseenter', () => {
                        el.style.transform = 'scale(1.3)';
                        popup.setLngLat([d.lng, d.lat]).addTo(mapInstanceRef.current);
                    });

                    el.addEventListener('mouseleave', () => {
                        el.style.transform = 'scale(1.0)';
                        popup.remove();
                    });

                    // Click event to select defect and open detail drawer
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setSelectedDefect(d);
                    });

                    mapMarkersRef.current.push(marker);
                });
            }, [filteredDefects, selectedDefect, layersConfig.defects]);

            // 5. Coverage Map Layer Effect (green=<=7d, yellow=<=30d, red=>30d)
            useEffect(() => {
                if (!mapInstanceRef.current || !window.maplibregl) return;
                const map = mapInstanceRef.current;

                const removeCoverageLayer = () => {
                    if (map.getLayer('coverage-lines-layer')) map.removeLayer('coverage-lines-layer');
                    if (map.getLayer('coverage-labels-layer')) map.removeLayer('coverage-labels-layer');
                    if (map.getSource('coverage-src')) map.removeSource('coverage-src');
                };

                if (!layersConfig.coverage) {
                    removeCoverageLayer();
                    return;
                }

                fetch('/api/fleet/coverage?days=7')
                    .then(res => res.json())
                    .then(data => {
                        if (!data.corridors) return;

                        const features = data.corridors.map(c => {
                            const color = c.status === 'green' ? '#10b981' : (c.status === 'yellow' ? '#eab308' : '#ef4444');
                            return {
                                type: 'Feature',
                                properties: {
                                    road_name: c.road_name,
                                    status: c.status,
                                    color: color,
                                    age_days: c.age_days,
                                    last_scanned: c.last_scanned_formatted
                                },
                                geometry: {
                                    type: 'LineString',
                                    coordinates: [
                                        [c.start_coords[1], c.start_coords[0]],
                                        [c.end_coords[1], c.end_coords[0]]
                                    ]
                                }
                            };
                        });

                        const geojson = {
                            type: 'FeatureCollection',
                            features: features
                        };

                        const renderCoverage = () => {
                            removeCoverageLayer();

                            map.addSource('coverage-src', {
                                type: 'geojson',
                                data: geojson
                            });

                            map.addLayer({
                                id: 'coverage-lines-layer',
                                type: 'line',
                                source: 'coverage-src',
                                layout: {
                                    'line-join': 'round',
                                    'line-cap': 'round'
                                },
                                paint: {
                                    'line-color': ['get', 'color'],
                                    'line-width': 7,
                                    'line-opacity': 0.85
                                }
                            });

                            map.addLayer({
                                id: 'coverage-labels-layer',
                                type: 'symbol',
                                source: 'coverage-src',
                                layout: {
                                    'text-field': ['get', 'road_name'],
                                    'text-size': 11,
                                    'text-offset': [0, 1.2],
                                    'text-allow-overlap': false
                                },
                                paint: {
                                    'text-color': ['get', 'color'],
                                    'text-halo-color': '#0B0F19',
                                    'text-halo-width': 2
                                }
                            });
                        };

                        if (map.isStyleLoaded()) {
                            renderCoverage();
                        } else {
                            map.once('load', renderCoverage);
                        }
                    })
                    .catch(err => console.error("Error loading coverage layer:", err));

                return () => {
                    removeCoverageLayer();
                };
            }, [layersConfig.coverage]);

            const open3DTwinModal = (defectObj) => {
                if (defectObj) {
                    setSelectedDefect(defectObj);
                    setActiveTwinDefectId(defectObj.raw_id || defectObj.id);
                } else {
                    setActiveTwinDefectId(null);
                }
                setShowTwinModal(true);
            };

            const activeRegionObj = regionsList.find(r => r.key === selectedRegion);

            return (
                <div style={{ width: '100%', height: '100%', position: 'relative', background: '#0B0F19' }}>
                    {/* MAPLIBRE GL JS CONTAINER */}
                    <div ref={mapContainerRef} id="map-container" style={{ width: '100%', height: '100%', position: 'absolute', top: 0, left: 0, zIndex: 1 }} />

                    {/* KPI SUMMARY CARDS */}
                    <div style={styles.kpiContainer}>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>TOTAL</span>
                            <span style={{ ...styles.kpiValue, color: '#00F2FE' }}>{kpiStats.total}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>CRITICAL</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.Critical }}>{kpiStats.critical}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>HIGH</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.High }}>{kpiStats.high}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>MEDIUM</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.Medium }}>{kpiStats.medium}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>LOW</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.Low }}>{kpiStats.low}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>REPAIRED</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.Repaired }}>{kpiStats.repaired}</span>
                        </div>
                        <div 
                            style={{ ...styles.kpiCard, border: '1px solid #00F2FE', cursor: 'pointer', background: 'rgba(0,242,254,0.1)' }}
                            onClick={() => setShowSavingsModal(true)}
                            title="Click for Financial Savings Breakdown"
                        >
                            <span style={{ ...styles.kpiLabel, color: '#00F2FE' }}>POTENTIAL SAVINGS</span>
                            <span style={{ ...styles.kpiValue, color: '#00F2FE' }}>
                                ${costSummary ? (costSummary.net_savings > 1000000 ? (costSummary.net_savings / 1000000).toFixed(1) + 'M' : (costSummary.net_savings / 1000).toFixed(0) + 'K') : '$719.2M'}
                            </span>
                        </div>
                    </div>

                    {/* FILTER & CONTROL BAR */}
                    <div style={styles.filterBar}>
                        <div style={{ flex: 1, minWidth: '180px' }}>
                            <input
                                type="text"
                                placeholder="Search Defect ID, Corridor..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                style={styles.searchInput}
                            />
                        </div>

                        <div style={styles.filterGroup}>
                            <span style={styles.filterLabel}>REGION:</span>
                            <select
                                value={selectedRegion}
                                onChange={(e) => setSelectedRegion(e.target.value)}
                                style={styles.selectInput}
                            >
                                <option value="ALL">All Regions ({defects.length})</option>
                                {regionsList.map(r => (
                                    <option key={r.key} value={r.key}>{r.name} ({r.count})</option>
                                ))}
                            </select>
                        </div>

                        <div style={styles.filterGroup}>
                            <span style={styles.filterLabel}>SEVERITY:</span>
                            <select
                                value={filterSeverity}
                                onChange={(e) => setFilterSeverity(e.target.value)}
                                style={styles.selectInput}
                            >
                                <option value="ALL">All Severities</option>
                                <option value="Critical">Critical</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                        <div style={styles.filterGroup}>
                            <span style={styles.filterLabel}>TYPE:</span>
                            <select
                                value={filterType}
                                onChange={(e) => setFilterType(e.target.value)}
                                style={styles.selectInput}
                            >
                                <option value="ALL">All Types</option>
                                <option value="pothole">Pothole</option>
                                <option value="crack">Crack</option>
                                <option value="rutting">Rutting</option>
                            </select>
                        </div>

                        <button onClick={() => focusRegion(selectedRegion)} style={styles.focusBtn}>
                            📍 RE-CENTER
                        </button>

                        <button onClick={() => open3DTwinModal()} style={styles.twinBtn}>
                            💎 3D DIGITAL TWIN
                        </button>
                    </div>

                    {/* LAYER CONTROLS SIDEBAR */}
                    <div style={styles.layerSidebar}>
                        <div style={styles.sidebarTitle}>MAP LAYERS</div>
                        <label style={styles.layerCheckboxRow}>
                            <input
                                type="checkbox"
                                checked={layersConfig.defects}
                                onChange={(e) => setLayersConfig({ ...layersConfig, defects: e.target.checked })}
                            />
                            Pothole Defects
                        </label>
                        <label style={styles.layerCheckboxRow}>
                            <input
                                type="checkbox"
                                checked={layersConfig.heatmap}
                                onChange={(e) => setLayersConfig({ ...layersConfig, heatmap: e.target.checked })}
                            />
                            Risk Heatmap
                        </label>
                        <label style={styles.layerCheckboxRow}>
                            <input
                                type="checkbox"
                                checked={layersConfig.coverage}
                                onChange={(e) => setLayersConfig({ ...layersConfig, coverage: e.target.checked })}
                            />
                            Coverage Map (Fleet Scans)
                        </label>
                    </div>

                    {/* MAP LEGEND */}
                    <div style={styles.legendCard}>
                        {layersConfig.coverage ? (
                            <div>
                                <div style={styles.legendTitle}>COVERAGE MAP SCAN RECENCY</div>
                                <div style={styles.legendRow}>
                                    <span style={{ ...styles.legendDot, backgroundColor: '#10b981' }} />
                                    <span>Scanned &le; 7 Days</span>
                                </div>
                                <div style={styles.legendRow}>
                                    <span style={{ ...styles.legendDot, backgroundColor: '#eab308' }} />
                                    <span>Scanned 8 &ndash; 30 Days</span>
                                </div>
                                <div style={styles.legendRow}>
                                    <span style={{ ...styles.legendDot, backgroundColor: '#ef4444' }} />
                                    <span>Scanned &gt; 30 Days</span>
                                </div>
                            </div>
                        ) : (
                            <div>
                                <div style={styles.legendTitle}>SEVERITY LEGEND</div>
                                {Object.entries(SEVERITY_COLORS).map(([lvl, col]) => (
                                    <div key={lvl} style={styles.legendRow}>
                                        <span style={{ ...styles.legendDot, backgroundColor: col }} />
                                        <span>{lvl}</span>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* FINANCIAL SAVINGS SUMMARY MODAL */}
                    {showSavingsModal && costSummary && (
                        <div style={dtStyles.overlay}>
                            <div style={{ ...dtStyles.card, width: '560px' }}>
                                <div style={dtStyles.headerRow}>
                                    <h3 style={dtStyles.title}>💰 FINANCIAL COST & RISK SAVINGS SUMMARY</h3>
                                    <button onClick={() => setShowSavingsModal(false)} style={dtStyles.closeBtn}>✕</button>
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginTop: '12px' }}>
                                    <div style={{ background: 'rgba(15,23,42,0.8)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(0,242,254,0.2)' }}>
                                        <div style={{ fontSize: '10px', fontFamily: 'Orbitron', color: '#9CA3AF' }}>TOTAL DEFECTS</div>
                                        <div style={{ fontSize: '20px', fontFamily: 'Orbitron', color: '#00F2FE', fontWeight: 'bold' }}>{costSummary.total_defects}</div>
                                    </div>
                                    <div style={{ background: 'rgba(15,23,42,0.8)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(0,242,254,0.2)' }}>
                                        <div style={{ fontSize: '10px', fontFamily: 'Orbitron', color: '#9CA3AF' }}>AVG REPAIR COST</div>
                                        <div style={{ fontSize: '20px', fontFamily: 'Orbitron', color: '#10b981', fontWeight: 'bold' }}>${costSummary.avg_repair_cost.toFixed(2)}</div>
                                    </div>
                                    <div style={{ background: 'rgba(15,23,42,0.8)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(0,242,254,0.2)' }}>
                                        <div style={{ fontSize: '10px', fontFamily: 'Orbitron', color: '#9CA3AF' }}>TOTAL ESTIMATED REPAIR</div>
                                        <div style={{ fontSize: '20px', fontFamily: 'Orbitron', color: '#10b981', fontWeight: 'bold' }}>${costSummary.total_repair_cost.toLocaleString()}</div>
                                    </div>
                                    <div style={{ background: 'rgba(15,23,42,0.8)', padding: '12px', borderRadius: '8px', border: '1px solid rgba(0,242,254,0.2)' }}>
                                        <div style={{ fontSize: '10px', fontFamily: 'Orbitron', color: '#9CA3AF' }}>ANNUAL VEHICLE DAMAGE RISK</div>
                                        <div style={{ fontSize: '20px', fontFamily: 'Orbitron', color: '#ef4444', fontWeight: 'bold' }}>${costSummary.total_damage_risk.toLocaleString()}</div>
                                    </div>
                                </div>
                                <div style={{ background: 'rgba(0,242,254,0.15)', border: '1px solid #00F2FE', borderRadius: '10px', padding: '16px', marginTop: '16px', textAlign: 'center' }}>
                                    <div style={{ fontSize: '11px', fontFamily: 'Orbitron', color: '#9CA3AF', letterSpacing: '1px' }}>NET FINANCIAL SAVINGS</div>
                                    <div style={{ fontSize: '28px', fontFamily: 'Orbitron', color: '#00F2FE', fontWeight: 'bold', marginTop: '4px' }}>
                                        ${costSummary.net_savings.toLocaleString()}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* DETAIL DRAWER */}
                    {selectedDefect && (
                        <div style={styles.detailDrawer}>
                            <div style={styles.drawerHeader}>
                                <h3 style={{ margin: 0, fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '15px' }}>
                                    DEFECT #{selectedDefect.id}
                                </h3>
                                <button onClick={() => setSelectedDefect(null)} style={styles.closeDrawerBtn}>✕</button>
                            </div>

                            <div style={styles.drawerBody}>
                                <div style={styles.drawerRow}>
                                    <span style={styles.drawerMetaLabel}>Type:</span>
                                    <b>{selectedDefect.type.toUpperCase()}</b>
                                </div>
                                <div style={styles.drawerRow}>
                                    <span style={styles.drawerMetaLabel}>Severity:</span>
                                    <b style={{ color: SEVERITY_COLORS[selectedDefect.severity] || '#00F2FE' }}>
                                        {selectedDefect.severity.toUpperCase()}
                                    </b>
                                </div>
                                <div style={styles.drawerRow}>
                                    <span style={styles.drawerMetaLabel}>Depth / Dim:</span>
                                    <b>{selectedDefect.depth_cm} cm ({selectedDefect.width_cm || 30} × {selectedDefect.length_cm || 40} cm)</b>
                                </div>
                                <div style={styles.drawerRow}>
                                    <span style={styles.drawerMetaLabel}>GPS:</span>
                                    <span>{selectedDefect.lat.toFixed(5)}, {selectedDefect.lng.toFixed(5)}</span>
                                </div>

                                {/* COST BREAKDOWN BLOCK */}
                                <div style={{ background: 'rgba(0, 242, 254, 0.05)', border: '1px solid rgba(0, 242, 254, 0.3)', borderRadius: '8px', padding: '10px', marginTop: '8px' }}>
                                    <div style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '11px', fontWeight: 'bold', marginBottom: '6px' }}>
                                        💰 COST & RISK CALCULATOR
                                    </div>
                                    <div style={{ fontSize: '11px', display: 'flex', justifyContent: 'space-between', marginBottom: '3px' }}>
                                        <span style={{ color: '#9CA3AF' }}>Estimated Repair:</span>
                                        <b style={{ color: '#10b981' }}>${selectedCostData ? selectedCostData.repair_cost.toFixed(2) : '150.00'}</b>
                                    </div>
                                    <div style={{ fontSize: '10px', color: '#9CA3AF', paddingLeft: '8px', marginBottom: '4px' }}>
                                        Materials: ${selectedCostData ? selectedCostData.breakdown.materials_cost.toFixed(2) : '0'} | Labor: ${selectedCostData ? selectedCostData.breakdown.labor_cost.toFixed(2) : '0'} | Equip: $50
                                    </div>
                                    <div style={{ fontSize: '11px', display: 'flex', justifyContent: 'space-between', marginBottom: '3px' }}>
                                        <span style={{ color: '#9CA3AF' }}>Annual Vehicle Damage:</span>
                                        <b style={{ color: '#ef4444' }}>${selectedCostData ? selectedCostData.damage_risk_annual.toLocaleString() : '500,000'}</b>
                                    </div>
                                    <div style={{ fontSize: '11px', display: 'flex', justifyContent: 'space-between', borderTop: '1px dashed rgba(0,242,254,0.3)', paddingTop: '4px', marginTop: '4px' }}>

                                    </div>
                                </div>

                                <div style={{ borderTop: '1px solid rgba(255,255,255,0.1)', margin: '10px 0' }} />

                                <button onClick={() => open3DTwinModal(selectedDefect)} style={styles.drawerActionBtnPrimary}>
                                    💎 INSPECT IN 3D
                                </button>
                            </div>
                        </div>
                    )}

                    {/* DIGITAL TWIN MODAL */}
                    {showTwinModal && (
                        <DigitalTwinModal
                            defect={selectedDefect}
                            defectId={activeTwinDefectId}
                            onClose={() => setShowTwinModal(false)}
                        />
                    )}
                </div>
            );
