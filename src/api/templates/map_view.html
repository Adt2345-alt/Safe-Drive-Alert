<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeDrive AI - HD Mapping & Digital Twin</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap"
        rel="stylesheet">

    <!-- MapLibre GL JS CSS & JS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <!-- Deck.gl CDN -->
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>

    <!-- Turf.js CDN -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- React 18 & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel Standalone for JSX Browser Transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-dark: #0B0F19;
            --panel-bg: rgba(11, 15, 25, 0.9);
            --cyan: #00F2FE;
            --yellow: #eab308;
            --orange: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
            --green: #10b981;
            --text-main: #E5E7EB;
            --text-dim: #9CA3AF;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow: hidden;
        }

        /* Top Header Nav */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            background: rgba(11, 15, 25, 0.95);
            z-index: 1000;
            height: 56px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .header .brand-text {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: var(--text-dim);
            padding: 5px 12px;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .tab-btn:hover {
            border-color: var(--cyan);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            font-weight: bold;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.5;
            }
        }

        #app-root {
            width: 100vw;
            height: calc(100vh - 56px);
            margin-top: 56px;
            position: relative;
        }

        /* MapLibre Map Container */
        #map-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>

<body>

    <!-- Top Header Bar -->
    <div class="header">
        <div class="brand-title" onclick="window.location.href='/'">
            <span class="brand-text">Drive Safe Alert</span>
        </div>

        <div class="nav-tabs">
            <a href="/" class="tab-btn">Simulation Drive</a>
            <a href="/map" class="tab-btn active">HD Map View</a>
            <a href="/work-orders" class="tab-btn">Work Orders</a>
            <a href="/fleet" class="tab-btn">Multi-Vehicle Fleet</a>
            <a href="/route-advisor" class="tab-btn">Route Advisor</a>
            <a href="/analytics" class="tab-btn">Analytics</a>
            <a href="/predictive-hotspots" class="tab-btn">Predictive Hotspot Detection</a>
        </div>

        <div class="system-status">
            <a href="/logout" class="tab-btn" style="border-color: var(--red); color: var(--red);">LOGOUT</a>
            <div class="status-dot"></div>
            <span style="font-family: var(--font-display); color: var(--green); font-size: 11px;">HD MAP ENGINE
                ONLINE</span>
        </div>
    </div>

    <!-- React App Container -->
    <div id="app-root"></div>

    <!-- JSX Application Script -->
    {% raw %}
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SEVERITY_COLORS = {
            Critical: '#ef4444',
            High: '#f59e0b',
            Medium: '#eab308',
            Low: '#3b82f6',
            Repaired: '#10b981'
        };

        // --- DIGITAL TWIN 3D INSPECTION MODAL COMPONENT ---
        function DigitalTwinModal({ defectId, defect: initialDefect, onClose }) {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const controlsRef = useRef(null);
            const rendererRef = useRef(null);

            const [defectData, setDefectData] = useState(initialDefect || null);
            const [loading, setLoading] = useState(true);
            const [showLabels, setShowLabels] = useState(true);
            const [isMeasuring, setIsMeasuring] = useState(false);
            const [measurePoints, setMeasurePoints] = useState([]);
            const [measuredDistance, setMeasuredDistance] = useState(null);
            const [compareMode, setCompareMode] = useState(false);
            const [nearbyDefects, setNearbyDefects] = useState([]);
            const [allDefectsList, setAllDefectsList] = useState([]);

            const depthLabelRef = useRef(null);
            const widthLabelRef = useRef(null);
            const lengthLabelRef = useRef(null);
            const showLabelsRef = useRef(showLabels);
            showLabelsRef.current = showLabels;

            // 1. Fetch list of available defects & auto-select if needed
            useEffect(() => {
                fetch('/api/map/defects?limit=100')
                    .then(res => res.json())
                    .then(data => {
                        if (data.defects && data.defects.length > 0) {
                            setAllDefectsList(data.defects);

                            const targetId = initialDefect ? initialDefect.id : defectId;
                            if (!targetId && !defectData) {
                                // Auto-select first recorded defect
                                const first = data.defects[0];
                                const rawId = first.raw_id || first.id;
                                const numId = typeof rawId === 'number' ? rawId : parseInt(String(rawId).replace('DEF-', ''), 10);
                                if (numId && !isNaN(numId)) {
                                    fetch(`/api/defects/${numId}`)
                                        .then(r => r.json())
                                        .then(d => { setDefectData(d); setLoading(false); })
                                        .catch(() => { setDefectData(first); setLoading(false); });
                                } else {
                                    setDefectData(first);
                                    setLoading(false);
                                }
                            }
                        } else {
                            setLoading(false);
                        }
                    })
                    .catch(err => {
                        console.error("Error loading defects list:", err);
                        setLoading(false);
                    });
            }, []);

            // 2. Fetch exact defect telemetry by ID if passed explicitly
            useEffect(() => {
                const targetId = initialDefect ? initialDefect.id : defectId;
                if (!targetId) return;

                const numericId = typeof targetId === 'number' ? targetId : parseInt(String(targetId).replace('DEF-', ''), 10);

                if (numericId && !isNaN(numericId)) {
                    setLoading(true);
                    fetch(`/api/defects/${numericId}`)
                        .then(res => {
                            if (!res.ok) throw new Error("Defect not found");
                            return res.json();
                        })
                        .then(data => {
                            setDefectData(data);
                            setLoading(false);
                        })
                        .catch(err => {
                            console.warn("Could not fetch defect by ID, using initial:", err);
                            setDefectData(initialDefect);
                            setLoading(false);
                        });
                } else if (initialDefect) {
                    setDefectData(initialDefect);
                    setLoading(false);
                }
            }, [defectId, initialDefect]);


            // 2. Fetch nearby defects for comparison mode
            useEffect(() => {
                if (compareMode && defectData) {
                    const numericId = typeof defectData.id === 'number' ? defectData.id : parseInt(String(defectData.id).replace('DEF-', ''), 10);
                    if (numericId) {
                        fetch(`/api/defects/${numericId}/nearby?radius_m=200`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.nearby_defects) setNearbyDefects(data.nearby_defects);
                            })
                            .catch(err => console.error("Error fetching nearby defects:", err));
                    }
                }
            }, [compareMode, defectData]);

            // Helper to generate procedural asphalt texture with fast ImageData buffer
            const createAsphaltTexture = (THREE) => {
                if (window._asphaltTextureCache) return window._asphaltTextureCache;
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');

                const imgData = ctx.createImageData(512, 512);
                const data = imgData.data;

                for (let i = 0; i < data.length; i += 4) {
                    const base = 35 + Math.floor(Math.random() * 15);
                    const noise = (Math.random() > 0.65) ? (Math.random() * 40 - 20) : 0;
                    const val = Math.max(10, Math.min(90, Math.floor(base + noise)));
                    data[i] = val;
                    data[i + 1] = val + 4;
                    data[i + 2] = val + 8;
                    data[i + 3] = 255;
                }
                ctx.putImageData(imgData, 0, 0);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.lineWidth = 1;
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    const y = Math.random() * 512;
                    ctx.moveTo(0, y);
                    ctx.lineTo(512, y + (Math.random() * 10 - 5));
                    ctx.stroke();
                }

                const texture = new THREE.CanvasTexture(canvas);
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(4, 8);
                window._asphaltTextureCache = texture;
                return texture;
            };

            // 3. Setup Three.js 3D Scene
            useEffect(() => {
                if (!mountRef.current || !window.THREE) return;
                const THREE = window.THREE;
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;

                // Scene setup
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0e17);
                scene.fog = new THREE.FogExp2(0x0a0e17, 0.02);
                sceneRef.current = scene;

                // Camera setup
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.set(3.2, 3.0, 4.2); // 3/4 view angle
                cameraRef.current = camera;

                // Renderer setup
                const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
                renderer.setSize(width, height);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                // Orbit Controls
                let controls;
                if (window.THREE.OrbitControls) {
                    controls = new window.THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    controls.maxPolarAngle = Math.PI / 2 - 0.02;
                    controls.minDistance = 1.0;
                    controls.maxDistance = 25.0;
                    controlsRef.current = controls;
                }

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x556070, 0.4);
                scene.add(ambientLight);

                const sunLight = new THREE.DirectionalLight(0xffffff, 1.3);
                sunLight.position.set(12, 22, 15);
                sunLight.castShadow = true;
                scene.add(sunLight);

                const cyanSpot = new THREE.SpotLight(0x00f2fe, 1.8, 30, Math.PI / 4, 0.5);
                cyanSpot.position.set(-8, 15, 8);
                scene.add(cyanSpot);

                // --- BUILD 3D ENVIRONMENT ---
                const depthCm = defectData ? (defectData.depth_cm || 6.5) : 6.5;
                const widthCm = defectData ? (defectData.width_cm || 32.5) : 32.5;
                const lengthCm = defectData ? (defectData.length_cm || 48.0) : 48.0;
                const defectType = (defectData ? (defectData.type || defectData.defect_type || 'pothole') : 'pothole').toLowerCase();

                const depthM = depthCm / 100.0;
                const widthM = widthCm / 100.0;
                const lengthM = lengthCm / 100.0;

                if (controls) {
                    controls.target.set(0, 0, 0);
                    controls.update();
                }

                // Road Mesh (20m length x 12m width) with optimized grid (60 x 60)
                const roadGeo = new THREE.PlaneGeometry(12, 20, 60, 60);
                roadGeo.rotateX(-Math.PI / 2);

                const pos = roadGeo.attributes.position;
                const colors = [];

                const asphaltColor = new THREE.Color(0x2c323f);
                const darkPitColor = new THREE.Color(0x08090b);
                const yellowStripeColor = new THREE.Color(0xeab308);

                for (let i = 0; i < pos.count; i++) {
                    const x = pos.getX(i);
                    const z = pos.getZ(i);

                    let dispY = 0.0;
                    let colorVal = asphaltColor.clone();

                    if (defectType === 'crack') {
                        // 3D Longitudinal Jagged Crack Fissure
                        const crackPathX = 0.35 * Math.sin(z * 1.8) + 0.15 * Math.cos(z * 4.2);
                        const distToCrack = Math.abs(x - crackPathX);
                        const crackLengthLimit = lengthM * 0.8;

                        if (Math.abs(z) < crackLengthLimit) {
                            const zFalloff = Math.cos((z / crackLengthLimit) * (Math.PI / 2));
                            const crackWidth = Math.max(0.04, widthM * 0.35);
                            
                            if (distToCrack < crackWidth) {
                                const factor = 1.0 - (distToCrack / crackWidth);
                                dispY = -depthM * Math.pow(factor, 1.2) * zFalloff;
                                colorVal.lerp(darkPitColor, Math.pow(factor, 0.7));
                            }
                        }
                    } else if (defectType === 'speedbump' || defectType === 'speed_bump') {
                        // 3D Convex Raised Speed Ramp (Y > 0)
                        const rampLength = Math.max(0.8, lengthM * 1.2);
                        if (Math.abs(z) < rampLength && Math.abs(x) < 4.5) {
                            const zFactor = Math.cos((z / rampLength) * (Math.PI / 2));
                            dispY = Math.max(0.06, depthM * 0.8) * Math.pow(zFactor, 1.5);
                            
                            // Stripe pattern across ramp
                            if (Math.sin(x * 6.0 + z * 3.0) > 0.1) {
                                colorVal.lerp(yellowStripeColor, 0.85);
                            }
                        }
                    } else {
                        // 3D Pothole Bowl Depression (Y < 0)
                        const rx = x / Math.max(0.2, widthM * 0.65);
                        const rz = z / Math.max(0.2, lengthM * 0.65);
                        const dist = Math.sqrt(rx * rx + rz * rz);

                        if (dist < 1.0) {
                            const falloff = Math.cos(dist * Math.PI / 2);
                            const angle = Math.atan2(z, x);
                            const noise = 0.80 + 0.38 * (Math.sin(angle * 5 + x * 9) * Math.cos(z * 9));
                            dispY = -depthM * Math.pow(falloff, 1.3) * noise;
                            colorVal.lerp(darkPitColor, Math.pow(falloff, 0.75));
                        }
                    }

                    pos.setY(i, dispY);
                    colors.push(colorVal.r, colorVal.g, colorVal.b);
                }

                roadGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                roadGeo.computeVertexNormals();

                const asphaltTexture = createAsphaltTexture(THREE);
                const roadMat = new THREE.MeshStandardMaterial({
                    map: asphaltTexture,
                    vertexColors: true,
                    roughness: 0.75,
                    metalness: 0.20
                });

                const roadMesh = new THREE.Mesh(roadGeo, roadMat);
                roadMesh.receiveShadow = true;
                scene.add(roadMesh);

                // Broken yellow center line
                for (let z = -9; z < 9; z += 2.5) {
                    const dashGeo = new THREE.PlaneGeometry(0.18, 1.3);
                    dashGeo.rotateX(-Math.PI / 2);
                    const dashMat = new THREE.MeshBasicMaterial({ color: 0xeab308 });
                    const dash = new THREE.Mesh(dashGeo, dashMat);
                    dash.position.set(0, 0.003, z);
                    scene.add(dash);
                }

                // Solid white edge lines
                [-4.5, 4.5].forEach(x => {
                    const edgeGeo = new THREE.PlaneGeometry(0.18, 20);
                    edgeGeo.rotateX(-Math.PI / 2);
                    const edgeMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
                    const edge = new THREE.Mesh(edgeGeo, edgeMat);
                    edge.position.set(x, 0.003, 0);
                    scene.add(edge);
                });

                // Sidewalks & Curbs
                [-5.35, 5.35].forEach(x => {
                    const sideGeo = new THREE.BoxGeometry(1.5, 0.12, 20);
                    const sideMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.6 });
                    const sidewalk = new THREE.Mesh(sideGeo, sideMat);
                    sidewalk.position.set(x, 0.06, 0);
                    scene.add(sidewalk);
                });

                // 3D Measurement Callout Lines & Target Marker inside 3D Scene
                if (defectData) {
                    // Vertical Cyan Depth Line
                    const depthPoints = [
                        new THREE.Vector3(0, 0.04, 0),
                        new THREE.Vector3(0, defectType === 'speedbump' ? Math.max(0.06, depthM * 0.8) : -depthM, 0)
                    ];
                    const depthLineGeo = new THREE.BufferGeometry().setFromPoints(depthPoints);
                    const depthLineMat = new THREE.LineDashedMaterial({ color: 0x00f2fe, dashSize: 0.04, gapSize: 0.02 });
                    const depthLine = new THREE.Line(depthLineGeo, depthLineMat);
                    depthLine.computeLineDistances();
                    scene.add(depthLine);

                    // Pulsing Center Point Marker
                    const ptGeo = new THREE.SphereGeometry(0.05, 16, 16);
                    const ptMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
                    const ptMesh = new THREE.Mesh(ptGeo, ptMat);
                    ptMesh.position.set(0, defectType === 'speedbump' ? Math.max(0.06, depthM * 0.8) : -depthM, 0);
                    scene.add(ptMesh);

                    // Crosshair 3D target ring on road
                    const ringGeo = new THREE.RingGeometry(widthM * 0.45, widthM * 0.50, 32);
                    ringGeo.rotateX(-Math.PI / 2);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe, side: THREE.DoubleSide, opacity: 0.7, transparent: true });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.set(0, 0.005, 0);
                    scene.add(ringMesh);

                    // Horizontal Orange Width Line
                    const widthPoints = [
                        new THREE.Vector3(-widthM / 2, 0.03, 0),
                        new THREE.Vector3(widthM / 2, 0.03, 0)
                    ];
                    const widthLineGeo = new THREE.BufferGeometry().setFromPoints(widthPoints);
                    const widthLineMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, linewidth: 3 });
                    const widthLine = new THREE.Line(widthLineGeo, widthLineMat);
                    scene.add(widthLine);

                    // Horizontal Green Length Line
                    const lengthPoints = [
                        new THREE.Vector3(0, 0.03, -lengthM / 2),
                        new THREE.Vector3(0, 0.03, lengthM / 2)
                    ];
                    const lengthLineGeo = new THREE.BufferGeometry().setFromPoints(lengthPoints);
                    const lengthLineMat = new THREE.LineBasicMaterial({ color: 0x10b981, linewidth: 3 });
                    const lengthLine = new THREE.Line(lengthLineGeo, lengthLineMat);
                    scene.add(lengthLine);

                    // --- 3D DEMO POTHOLE CLUSTER DOTS ---
                    const demo3DDots = [
                        { x: -2.2, z: -4.5, depth: 0.07, color: 0xef4444, label: 'Pothole Dot #1 (Critical - 7.0cm)' },
                        { x: 1.8, z: 3.8, depth: 0.05, color: 0xf59e0b, label: 'Pothole Dot #2 (High - 5.0cm)' },
                        { x: -1.4, z: 5.2, depth: 0.04, color: 0xeab308, label: 'Pothole Dot #3 (Medium - 4.0cm)' },
                        { x: 2.6, z: -3.1, depth: 0.08, color: 0xef4444, label: 'Pothole Dot #4 (Critical - 8.0cm)' }
                    ];

                    demo3DDots.forEach(dot => {
                        // 3D Sphere Marker Dot
                        const dotSphereGeo = new THREE.SphereGeometry(0.18, 16, 16);
                        const dotSphereMat = new THREE.MeshStandardMaterial({
                            color: dot.color,
                            emissive: dot.color,
                            emissiveIntensity: 0.7,
                            roughness: 0.2
                        });
                        const dotSphere = new THREE.Mesh(dotSphereGeo, dotSphereMat);
                        dotSphere.position.set(dot.x, 0.25, dot.z);
                        scene.add(dotSphere);

                        // Vertical Stem Line
                        const stemPts = [new THREE.Vector3(dot.x, 0.0, dot.z), new THREE.Vector3(dot.x, 0.5, dot.z)];
                        const stemGeo = new THREE.BufferGeometry().setFromPoints(stemPts);
                        const stemMat = new THREE.LineBasicMaterial({ color: dot.color, linewidth: 2 });
                        scene.add(new THREE.Line(stemGeo, stemMat));

                        // 3D Target Ring
                        const rGeo = new THREE.RingGeometry(0.28, 0.35, 32);
                        rGeo.rotateX(-Math.PI / 2);
                        const rMat = new THREE.MeshBasicMaterial({ color: dot.color, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                        const ring = new THREE.Mesh(rGeo, rMat);
                        ring.position.set(dot.x, 0.005, dot.z);
                        scene.add(ring);
                    });
                }

                // Direct DOM Hardware-Accelerated 60 FPS Animation loop
                let animId;
                const tempVec = new THREE.Vector3();
                const animate = () => {
                    animId = requestAnimationFrame(animate);
                    if (controls) controls.update();
                    renderer.render(scene, camera);

                    if (defectData && camera) {
                        const projectPoint = (v) => {
                            tempVec.copy(v);
                            tempVec.project(camera);
                            const x = (tempVec.x * 0.5 + 0.5) * width;
                            const y = (-(tempVec.y * 0.5) + 0.5) * height;
                            return { x, y, visible: tempVec.z < 1.0 };
                        };

                        const isShowing = showLabelsRef.current;

                        if (depthLabelRef.current) {
                            const p = projectPoint(new THREE.Vector3(0, -depthM / 2, 0));
                            depthLabelRef.current.style.transform = `translate(-50%, -100%) translate(${p.x}px, ${p.y}px)`;
                            depthLabelRef.current.style.display = (isShowing && p.visible) ? 'block' : 'none';
                        }
                        if (widthLabelRef.current) {
                            const p = projectPoint(new THREE.Vector3(widthM / 2, 0.05, 0));
                            widthLabelRef.current.style.transform = `translate(-50%, -100%) translate(${p.x}px, ${p.y}px)`;
                            widthLabelRef.current.style.display = (isShowing && p.visible) ? 'block' : 'none';
                        }
                        if (lengthLabelRef.current) {
                            const p = projectPoint(new THREE.Vector3(0, 0.05, lengthM / 2));
                            lengthLabelRef.current.style.transform = `translate(-50%, -100%) translate(${p.x}px, ${p.y}px)`;
                            lengthLabelRef.current.style.display = (isShowing && p.visible) ? 'block' : 'none';
                        }
                    }
                };
                animate();

                return () => {
                    cancelAnimationFrame(animId);
                    if (renderer && renderer.domElement && mountRef.current && mountRef.current.contains(renderer.domElement)) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                    if (renderer) {
                        renderer.dispose();
                    }
                };

            }, [defectData]);

            // Handle 3D canvas click for interactive measurement tool
            const handleCanvasClick = (e) => {
                if (!isMeasuring || !mountRef.current || !sceneRef.current || !cameraRef.current) return;
                const rect = mountRef.current.getBoundingClientRect();
                const mouse = new window.THREE.Vector2(
                    ((e.clientX - rect.left) / rect.width) * 2 - 1,
                    -((e.clientY - rect.top) / rect.height) * 2 + 1
                );

                const raycaster = new window.THREE.Raycaster();
                raycaster.setFromCamera(mouse, cameraRef.current);
                const intersects = raycaster.intersectObjects(sceneRef.current.children, true);

                if (intersects.length > 0) {
                    const pt = intersects[0].point;
                    setMeasurePoints(prev => {
                        if (prev.length >= 2) return [pt];
                        const next = [...prev, pt];
                        if (next.length === 2) {
                            const distM = next[0].distanceTo(next[1]);
                            setMeasuredDistance(Math.round(distM * 100 * 10) / 10);
                        }
                        return next;
                    });
                }
            };

            // Toolbar Actions
            const resetView = () => {
                if (cameraRef.current && controlsRef.current) {
                    cameraRef.current.position.set(0, 9, 14);

                    controlsRef.current.update();
                }

            const takeSnapshot = () => {
                if (!rendererRef.current) return;
                const dataUrl = rendererRef.current.domElement.toDataURL('image/png');
                const link = document.createElement('a');

            const lengthCm = defectData ? (defectData.length_cm || 48.0) : 48.0;

            // Volume approximation in Liters = 2/3 * pi * (w/2) * (l/2) * d / 1000
            const volumeLiters = Math.round((2 / 3) * Math.PI * (widthCm / 2) * (lengthCm / 2) * depthCm / 1000 * 10) / 10;
            const repairCostEst = Math.round(volumeLiters * 14.5 + 120);

            return (

                                        Real-time 3D Mesh Displaced Depth Analysis — {defectData ? (defectData.corridor || 'Recorded Route Corridor') : 'Road Segment'}

                                </div>
                            </div>

                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                {allDefectsList.length > 0 && (
                                    <select
                                        value={defectData ? (defectData.raw_id || defectData.id) : ''}
                                        onChange={(e) => {
                                            const targetId = parseInt(e.target.value, 10);
                                            if (targetId) {
                                                setLoading(true);
                                                fetch(`/api/defects/${targetId}`)
                                                    .then(r => r.json())
                                                    .then(d => { setDefectData(d); setLoading(false); })
                                                    .catch(err => console.error("Error switching defect:", err));
                                            }

                                        style={{
                                            background: '#0F172A', color: '#00F2FE', border: '1px solid #00F2FE',
                                            borderRadius: '6px', padding: '5px 10px', fontSize: '11px', fontFamily: 'Orbitron',
                                            cursor: 'pointer', outline: 'none'

                                        {allDefectsList.map(d => (
                                            <option key={d.id} value={d.raw_id || d.id}>
                                                {d.id || `DEF-${d.raw_id}`} - {(d.type || 'DEFECT').toUpperCase()} ({d.severity}) | {d.corridor || 'MG Road'}

                                        ))}
                                    </select>
                                )}
                                <button onClick={onClose} style={dtStyles.closeBtn}>✕</button>
                            </div>
                        </div>


                        {/* EMPTY STATE WARNING */}
                        {!defectData && !loading && (
                            <div style={dtStyles.emptyStateContainer}>
                                <div style={{ fontSize: '36px', marginBottom: '12px' }}>📍</div>
                                <h4 style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '16px', marginBottom: '8px' }}>
                                    NO DEFECT SELECTED FOR 3D INSPECTION
                                </h4>
                                <p style={{ color: '#9CA3AF', fontSize: '13px', maxWidth: '440px', margin: '0 auto 16px auto' }}>
                                    Click any marker on the map to inspect a defect in 3D.
                                </p>
                                <button onClick={onClose} style={dtStyles.closeModalBtn}>

                            </div>

                        {/* LOADING STATE */}
                        {loading && (

                        {/* 3D VIEWPORT & METRICS */}
                        {defectData && !loading && (

                                {/* TOOLBAR CONTROLS */}

                                    </button>
                                    <button
                                        onClick={() => { setIsMeasuring(!isMeasuring); setMeasurePoints([]); setMeasuredDistance(null); }}
                                        style={{ ...dtStyles.toolBtn, border: isMeasuring ? '1px solid #00F2FE' : '1px solid rgba(0,242,254,0.3)', background: isMeasuring ? 'rgba(0,242,254,0.2)' : 'rgba(15,23,42,0.8)' }}
                                    >

                                    </button>
                                    <button
                                        onClick={() => setShowLabels(!showLabels)}

                                    <button

                                    </button>
                                </div>

                                {/* THREE.JS CANVAS CONTAINER */}
                                <div
                                    ref={mountRef}
                                    onClick={handleCanvasClick}
                                    style={{
                                        width: '100%',
                                        height: '460px',
                                        borderRadius: '10px',

                                        position: 'relative',
                                        cursor: isMeasuring ? 'crosshair' : 'grab',
                                        border: '1px solid rgba(0, 242, 254, 0.3)'

                                >
                                    {/* FLOATING TELEMETRY INFO PANEL */}
                                    <div style={dtStyles.telemetryPanel}>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}>
                                            <span style={{ fontFamily: 'Orbitron', fontWeight: 'bold', color: '#00F2FE', fontSize: '13px' }}>
                                                {defectData.formatted_id || `DEF-${defectData.id}`}
                                            </span>
                                            <span style={{
                                                background: SEVERITY_COLORS[defectData.severity] || '#00F2FE',
                                                color: '#0B0F19', padding: '2px 8px', borderRadius: '4px',
                                                fontFamily: 'Orbitron', fontSize: '10px', fontWeight: 'bold'
                                            }}>
                                                {defectData.severity ? defectData.severity.toUpperCase() : 'HIGH'}
                                            </span>
                                        </div>

                                        <div style={dtStyles.metaGrid}>
                                            <div><span style={dtStyles.metaKey}>Type:</span> <b>{defectData.type ? defectData.type.toUpperCase() : 'POTHOLE'}</b></div>
                                            <div><span style={dtStyles.metaKey}>Confidence:</span> <b>{Math.round((defectData.confidence || 0.94) * 100)}%</b></div>

                                            <div><span style={dtStyles.metaKey}>Repair Est.:</span> <b style={{ color: '#10b981' }}>${repairCostEst}</b></div>
                                            <div><span style={dtStyles.metaKey}>Source:</span> <b>{defectData.source || 'Simulation Drive'}</b></div>
                                        </div>

                                        <div style={{ fontSize: '10px', color: '#9CA3AF', marginTop: '6px', borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '4px' }}>
                                            📍 {defectData.road_name || 'Golden Gate Park Route'} ({defectData.lat ? defectData.lat.toFixed(5) : 37.7699}, {defectData.lng ? defectData.lng.toFixed(5) : -122.4668})
                                        </div>
                                    </div>

                                    {/* 3D MEASUREMENT LABELS OVERLAY (Direct DOM 60 FPS) */}
                                    <div ref={depthLabelRef} style={{ ...dtStyles.labelBox, borderColor: '#00F2FE', top: 0, left: 0, display: 'none' }}>
                                        ↕ Depth: {depthCm} cm
                                    </div>
                                    <div ref={widthLabelRef} style={{ ...dtStyles.labelBox, borderColor: '#f59e0b', top: 0, left: 0, display: 'none' }}>
                                        ↔ Width: {widthCm} cm
                                    </div>
                                    <div ref={lengthLabelRef} style={{ ...dtStyles.labelBox, borderColor: '#10b981', top: 0, left: 0, display: 'none' }}>
                                        ⇕ Length: {lengthCm} cm
                                    </div>

                                    {/* INTERACTIVE MEASUREMENT TOOL RESULT */}
                                    {isMeasuring && (
                                        <div style={dtStyles.measureNotice}>
                                            📏 Click two points on the 3D road model to measure distance.
                                            {measurePoints.length === 1 && <div>Point 1 selected. Click Point 2...</div>}
                                            {measuredDistance !== null && (
                                                <div style={{ color: '#00F2FE', marginTop: '4px', fontWeight: 'bold' }}>
                                                    Measured 3D Distance: {measuredDistance} cm
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* COMPARISON PANEL OVERLAY */}
                                    {compareMode && (
                                        <div style={dtStyles.comparePanel}>
                                            <div style={{ fontFamily: 'Orbitron', color: '#f59e0b', fontSize: '11px', fontWeight: 'bold', marginBottom: '4px' }}>
                                                🔄 HISTORICAL COMPARISON MODE
                                            </div>
                                            <div style={{ fontSize: '10px', color: '#E5E7EB' }}>
                                                {nearbyDefects.length > 0 ? (
                                                    <div>Found {nearbyDefects.length} nearby historical defect scan(s) within 200m corridor.</div>
                                                ) : (
                                                    <div>No earlier historical scans recorded for this corridor position. Baseline scan saved.</div>
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* FOOTER DISCLOSURE */}
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '12px', fontSize: '11px', color: '#9CA3AF' }}>
                                    <span>3D Procedural Telemetry View (From Recorded Detection Database)</span>
                                    <span>Recorded Timestamp: {defectData.timestamp || 'Live Stream'}</span>
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const dtStyles = {
            overlay: {
                position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh',
                background: 'rgba(5, 8, 15, 0.88)', backdropFilter: 'blur(16px)',
                display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 3000
            },
            card: {
                width: '920px', background: '#0B0F19', border: '1px solid rgba(0, 242, 254, 0.4)',
                borderRadius: '16px', padding: '24px', boxShadow: '0 25px 60px rgba(0, 0, 0, 0.85)',
                display: 'flex', flexDirection: 'column'
            },
            headerRow: { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' },
            title: { fontFamily: 'Orbitron', color: '#00F2FE', margin: 0, fontSize: '17px', letterSpacing: '1px' },
            subtitle: { fontSize: '11px', color: '#9CA3AF', margin: '4px 0 0 0' },
            closeBtn: { background: 'transparent', border: 'none', color: '#ef4444', fontSize: '22px', cursor: 'pointer', padding: '0 4px' },
            emptyStateContainer: { textAlign: 'center', padding: '60px 20px' },
            closeModalBtn: {
                background: 'linear-gradient(135deg, #0284c7 0%, #00F2FE 100%)', color: '#0B0F19', border: 'none',
                padding: '8px 20px', borderRadius: '6px', fontFamily: 'Orbitron', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer'
            },
            loadingContainer: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '360px' },
            spinner: { width: '36px', height: '36px', border: '3px solid rgba(0,242,254,0.2)', borderTop: '3px solid #00F2FE', borderRadius: '50%', animation: 'spin 1s linear infinite' },
            toolbar: {
                position: 'absolute', top: '12px', right: '12px', display: 'flex', gap: '6px', zIndex: 100
            },
            toolBtn: {

                borderRadius: '6px', padding: '6px 10px', fontSize: '11px', fontFamily: 'Orbitron', cursor: 'pointer',
                backdropFilter: 'blur(8px)', transition: 'all 0.2s ease'
            },
            telemetryPanel: {

            },
