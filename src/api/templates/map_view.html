<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeDrive AI - HD Mapping & Digital Twin</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- MapLibre GL JS CSS & JS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <!-- Deck.gl CDN -->
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>

    <!-- Turf.js CDN -->
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- React 18 & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel Standalone for JSX Browser Transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-dark: #0B0F19;
            --panel-bg: rgba(11, 15, 25, 0.9);
            --cyan: #00F2FE;
            --yellow: #eab308;
            --orange: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
            --green: #10b981;
            --text-main: #E5E7EB;
            --text-dim: #9CA3AF;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow: hidden;
        }

        /* Top Header Nav */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            background: rgba(11, 15, 25, 0.95);
            z-index: 1000;
            height: 56px;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .header .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .header .brand-text {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: var(--text-dim);
            padding: 5px 12px;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .tab-btn:hover {
            border-color: var(--cyan);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            font-weight: bold;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        #app-root {
            width: 100vw;
            height: calc(100vh - 56px);
            margin-top: 56px;
            position: relative;
        }

        /* MapLibre Map Container */
        #map-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Top Header Bar -->
    <div class="header">
        <div class="brand-title" onclick="window.location.href='/'">
            <span class="brand-text">Drive Safe Alert</span>
        </div>

        <div class="nav-tabs">
            <a href="/" class="tab-btn">Simulation Drive</a>
            <a href="/" class="tab-btn">Road Video Analyzer</a>
            <a href="/map" class="tab-btn active">HD Map View</a>
            <a href="/" class="tab-btn">Analytics & Budgets</a>
        </div>

        <div class="system-status">
            <a href="/logout" class="tab-btn" style="border-color: var(--red); color: var(--red);">LOGOUT</a>
            <div class="status-dot"></div>
            <span style="font-family: var(--font-display); color: var(--green); font-size: 11px;">HD MAP ENGINE ONLINE</span>
        </div>
    </div>

    <!-- React App Container -->
    <div id="app-root"></div>

    <!-- JSX Application Script -->
    {% raw %}
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SEVERITY_COLORS = {
            Critical: '#ef4444',
            High: '#f59e0b',
            Medium: '#eab308',
            Low: '#3b82f6',
            Repaired: '#10b981'
        };

        // --- DIGITAL TWIN 3D INSPECTION MODAL COMPONENT ---
        function DigitalTwinModal({ defectId, defect: initialDefect, onClose }) {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const controlsRef = useRef(null);
            const rendererRef = useRef(null);

            const [defectData, setDefectData] = useState(initialDefect || null);
            const [loading, setLoading] = useState(true);
            const [showLabels, setShowLabels] = useState(true);
            const [isMeasuring, setIsMeasuring] = useState(false);
            const [measurePoints, setMeasurePoints] = useState([]);
            const [measuredDistance, setMeasuredDistance] = useState(null);
            const [compareMode, setCompareMode] = useState(false);
            const [nearbyDefects, setNearbyDefects] = useState([]);
            const [allDefectsList, setAllDefectsList] = useState([]);

            const [labelCoords, setLabelCoords] = useState({
                depth: { x: 0, y: 0, visible: false },
                width: { x: 0, y: 0, visible: false },
                length: { x: 0, y: 0, visible: false }
            });

            // 1. Fetch list of available defects & auto-select if needed
            useEffect(() => {
                fetch('/api/map/defects?limit=100')
                    .then(res => res.json())
                    .then(data => {
                        if (data.defects && data.defects.length > 0) {
                            setAllDefectsList(data.defects);

                            const targetId = initialDefect ? initialDefect.id : defectId;
                            if (!targetId && !defectData) {
                                // Auto-select first recorded defect
                                const first = data.defects[0];
                                const rawId = first.raw_id || first.id;
                                const numId = typeof rawId === 'number' ? rawId : parseInt(String(rawId).replace('DEF-', ''), 10);
                                if (numId && !isNaN(numId)) {
                                    fetch(`/api/defects/${numId}`)
                                        .then(r => r.json())
                                        .then(d => { setDefectData(d); setLoading(false); })
                                        .catch(() => { setDefectData(first); setLoading(false); });
                                } else {
                                    setDefectData(first);
                                    setLoading(false);
                                }
                            }
                        } else {
                            setLoading(false);
                        }
                    })
                    .catch(err => {
                        console.error("Error loading defects list:", err);
                        setLoading(false);
                    });
            }, []);

            // 2. Fetch exact defect telemetry by ID if passed explicitly
            useEffect(() => {
                const targetId = initialDefect ? initialDefect.id : defectId;
                if (!targetId) return;

                const numericId = typeof targetId === 'number' ? targetId : parseInt(String(targetId).replace('DEF-', ''), 10);
                
                if (numericId && !isNaN(numericId)) {
                    setLoading(true);
                    fetch(`/api/defects/${numericId}`)
                        .then(res => {
                            if (!res.ok) throw new Error("Defect not found");
                            return res.json();
                        })
                        .then(data => {
                            setDefectData(data);
                            setLoading(false);
                        })
                        .catch(err => {
                            console.warn("Could not fetch defect by ID, using initial:", err);
                            setDefectData(initialDefect);
                            setLoading(false);
                        });
                } else if (initialDefect) {
                    setDefectData(initialDefect);
                    setLoading(false);
                }
            }, [defectId, initialDefect]);


            // 2. Fetch nearby defects for comparison mode
            useEffect(() => {
                if (compareMode && defectData) {
                    const numericId = typeof defectData.id === 'number' ? defectData.id : parseInt(String(defectData.id).replace('DEF-', ''), 10);
                    if (numericId) {
                        fetch(`/api/defects/${numericId}/nearby?radius_m=200`)
                            .then(res => res.json())
                            .then(data => {
                                if (data.nearby_defects) setNearbyDefects(data.nearby_defects);
                            })
                            .catch(err => console.error("Error fetching nearby defects:", err));
                    }
                }
            }, [compareMode, defectData]);

            // 3. Setup Three.js 3D Scene
            useEffect(() => {
                if (!mountRef.current || !window.THREE) return;
                const THREE = window.THREE;
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;

                // Scene setup
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x070a12);
                scene.fog = new THREE.FogExp2(0x070a12, 0.025);
                sceneRef.current = scene;

                // Camera setup
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.set(0, 9, 14);
                cameraRef.current = camera;

                // Renderer setup
                const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
                renderer.setSize(width, height);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                // Controls
                let controls;
                if (window.THREE.OrbitControls) {
                    controls = new window.THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    controls.maxPolarAngle = Math.PI / 2 - 0.05;
                    controls.target.set(0, -0.2, 0);
                    controlsRef.current = controls;
                }

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                scene.add(ambientLight);

                const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
                sunLight.position.set(15, 30, 20);
                sunLight.castShadow = true;
                scene.add(sunLight);

                const cyanSpot = new THREE.SpotLight(0x00f2fe, 1.5, 40, Math.PI / 4, 0.5);
                cyanSpot.position.set(-10, 20, 10);
                scene.add(cyanSpot);

                // Grid ground base
                const grid = new THREE.GridHelper(60, 30, 0x00f2fe, 0x1e293b);
                grid.position.y = -0.1;
                scene.add(grid);

                // --- BUILD 3D ENVIRONMENT ---
                // Road mesh (30m length x 16m width)
                const depthCm = defectData ? (defectData.depth_cm || 6.0) : 6.0;
                const widthCm = defectData ? (defectData.width_cm || 36.0) : 36.0;
                const lengthCm = defectData ? (defectData.length_cm || 48.0) : 48.0;

                const depthM = depthCm / 100.0;
                const widthM = widthCm / 100.0;
                const lengthM = lengthCm / 100.0;

                const roadGeo = new THREE.PlaneGeometry(16, 30, 100, 100);
                roadGeo.rotateX(-Math.PI / 2);

                if (defectData) {
                    const pos = roadGeo.attributes.position;
                    for (let i = 0; i < pos.count; i++) {
                        const x = pos.getX(i);
                        const z = pos.getZ(i);

                        const rx = x / (widthM * 0.7);
                        const rz = z / (lengthM * 0.7);
                        const distSq = rx * rx + rz * rz;

                        if (distSq < 1.0) {
                            const falloff = Math.cos((Math.sqrt(distSq) * Math.PI) / 2);
                            const organicNoise = Math.sin(x * 20) * Math.cos(z * 20) * 0.15 + 0.85;
                            const disp = depthM * falloff * organicNoise;
                            pos.setY(i, -disp);
                        }
                    }
                    roadGeo.computeVertexNormals();
                }

                const roadMat = new THREE.MeshStandardMaterial({
                    color: 0x1e293b,
                    roughness: 0.88,
                    metalness: 0.12
                });
                const roadMesh = new THREE.Mesh(roadGeo, roadMat);
                roadMesh.receiveShadow = true;
                scene.add(roadMesh);

                // Road markings
                // Center line (dashed white)
                for (let z = -14; z < 14; z += 3) {
                    const dashGeo = new THREE.PlaneGeometry(0.15, 1.5);
                    dashGeo.rotateX(-Math.PI / 2);
                    const dashMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                    const dash = new THREE.Mesh(dashGeo, dashMat);
                    dash.position.set(0, 0.01, z);
                    scene.add(dash);
                }

                // Outer edge lines (solid white)
                [-6, 6].forEach(x => {
                    const edgeGeo = new THREE.PlaneGeometry(0.15, 30);
                    edgeGeo.rotateX(-Math.PI / 2);
                    const edgeMat = new THREE.MeshBasicMaterial({ color: 0x94a3b8 });
                    const edge = new THREE.Mesh(edgeGeo, edgeMat);
                    edge.position.set(x, 0.01, 0);
                    scene.add(edge);
                });

                // Sidewalks (1.5m wide) & Curbs (10cm high)
                [-7.25, 7.25].forEach(x => {
                    const sideGeo = new THREE.BoxGeometry(1.5, 0.1, 30);
                    const sideMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 });
                    const sidewalk = new THREE.Mesh(sideGeo, sideMat);
                    sidewalk.position.set(x, 0.05, 0);
                    scene.add(sidewalk);
                });

                // 3D Building Boxes along street edge
                const buildingMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5, metalness: 0.4 });
                [
                    { x: -12, z: -10, w: 6, h: 14, d: 8 },
                    { x: -12, z: 4, w: 6, h: 20, d: 10 },
                    { x: 12, z: -8, w: 6, h: 18, d: 9 },
                    { x: 12, z: 6, w: 6, h: 12, d: 7 }
                ].forEach(b => {
                    const bGeo = new THREE.BoxGeometry(b.w, b.h, b.d);
                    const bMesh = new THREE.Mesh(bGeo, buildingMat);
                    bMesh.position.set(b.x, b.h / 2, b.z);
                    scene.add(bMesh);

                    // Add subtle cyan wireframe outline to buildings
                    const wireGeo = new THREE.EdgesGeometry(bGeo);
                    const wireMat = new THREE.LineBasicMaterial({ color: 0x00f2fe, opacity: 0.3, transparent: true });
                    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
                    bMesh.add(wireframe);
                });

                // Glowing Rim Ring around Pothole
                if (defectData) {
                    const colorHex = SEVERITY_COLORS[defectData.severity] || '#00F2FE';
                    const rimGeo = new THREE.RingGeometry(widthM * 0.45, widthM * 0.52, 32);
                    rimGeo.rotateX(-Math.PI / 2);
                    const rimMat = new THREE.MeshBasicMaterial({
                        color: parseInt(colorHex.replace('#', '0x')),
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.8
                    });
                    const rim = new THREE.Mesh(rimGeo, rimMat);
                    rim.position.set(0, 0.02, 0);
                    scene.add(rim);

                    // 3D Measurement Overlay Lines
                    // 1. Vertical depth line
                    const depthLineGeo = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, 0.05, 0),
                        new THREE.Vector3(0, -depthM, 0)
                    ]);
                    const depthLineMat = new THREE.LineDashedMaterial({ color: 0x00f2fe, dashSize: 0.1, gapSize: 0.05 });
                    const depthLine = new THREE.Line(depthLineGeo, depthLineMat);
                    depthLine.computeLineDistances();
                    scene.add(depthLine);

                    // 2. Horizontal width line
                    const widthLineGeo = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(-widthM / 2, 0.05, 0),
                        new THREE.Vector3(widthM / 2, 0.05, 0)
                    ]);
                    const widthLineMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, linewidth: 2 });
                    const widthLine = new THREE.Line(widthLineGeo, widthLineMat);
                    scene.add(widthLine);

                    // 3. Horizontal length line
                    const lengthLineGeo = new THREE.BufferGeometry().setFromPoints([
                        new THREE.Vector3(0, 0.05, -lengthM / 2),
                        new THREE.Vector3(0, 0.05, lengthM / 2)
                    ]);
                    const lengthLineMat = new THREE.LineBasicMaterial({ color: 0x10b981, linewidth: 2 });
                    const lengthLine = new THREE.Line(lengthLineGeo, lengthLineMat);
                    scene.add(lengthLine);
                }

                // Animation loop
                let animId;
                const tempVec = new THREE.Vector3();
                const animate = () => {
                    animId = requestAnimationFrame(animate);
                    if (controls) controls.update();
                    renderer.render(scene, camera);

                    // Project 3D positions to 2D HTML screen label coordinates
                    if (defectData && camera) {
                        const projectPoint = (v) => {
                            tempVec.copy(v);
                            tempVec.project(camera);
                            const x = (tempVec.x * 0.5 + 0.5) * width;
                            const y = (-(tempVec.y * 0.5) + 0.5) * height;
                            return { x, y, visible: tempVec.z < 1.0 };
                        };

                        setLabelCoords({
                            depth: projectPoint(new THREE.Vector3(0, -depthM / 2, 0)),
                            width: projectPoint(new THREE.Vector3(widthM / 2, 0.1, 0)),
                            length: projectPoint(new THREE.Vector3(0, 0.1, lengthM / 2))
                        });
                    }
                };
                animate();

                return () => {
                    cancelAnimationFrame(animId);
                    if (renderer && renderer.domElement && mountRef.current && mountRef.current.contains(renderer.domElement)) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                    if (renderer) {
                        renderer.dispose();
                    }
                };

            }, [defectData]);

            // Handle 3D canvas click for interactive measurement tool
            const handleCanvasClick = (e) => {
                if (!isMeasuring || !mountRef.current || !sceneRef.current || !cameraRef.current) return;
                const rect = mountRef.current.getBoundingClientRect();
                const mouse = new window.THREE.Vector2(
                    ((e.clientX - rect.left) / rect.width) * 2 - 1,
                    -((e.clientY - rect.top) / rect.height) * 2 + 1
                );

                const raycaster = new window.THREE.Raycaster();
                raycaster.setFromCamera(mouse, cameraRef.current);
                const intersects = raycaster.intersectObjects(sceneRef.current.children, true);

                if (intersects.length > 0) {
                    const pt = intersects[0].point;
                    setMeasurePoints(prev => {
                        if (prev.length >= 2) return [pt];
                        const next = [...prev, pt];
                        if (next.length === 2) {
                            const distM = next[0].distanceTo(next[1]);
                            setMeasuredDistance(Math.round(distM * 100 * 10) / 10);
                        }
                        return next;
                    });
                }
            };

            // Toolbar Actions
            const resetView = () => {
                if (cameraRef.current && controlsRef.current) {
                    cameraRef.current.position.set(0, 9, 14);
                    controlsRef.current.target.set(0, -0.2, 0);
                    controlsRef.current.update();
                }
            };

            const takeSnapshot = () => {
                if (!rendererRef.current) return;
                const dataUrl = rendererRef.current.domElement.toDataURL('image/png');
                const link = document.createElement('a');
                const defId = defectData ? defectData.id : 'view';
                link.download = `SafeDrive-3D-Defect-${defId}.png`;
                link.href = dataUrl;
                link.click();
            };

            // Calculate derived volume & repair cost
            const depthCm = defectData ? (defectData.depth_cm || 6.0) : 6.0;
            const widthCm = defectData ? (defectData.width_cm || 36.0) : 36.0;
            const lengthCm = defectData ? (defectData.length_cm || 48.0) : 48.0;

            // Volume approximation in Liters = 2/3 * pi * (w/2) * (l/2) * d / 1000
            const volumeLiters = Math.round((2 / 3) * Math.PI * (widthCm / 2) * (lengthCm / 2) * depthCm / 1000 * 10) / 10;
            const repairCostEst = Math.round(volumeLiters * 14.5 + 120);

            return (
                <div style={dtStyles.overlay}>
                    <div style={dtStyles.card}>

                        {/* MODAL HEADER */}
                        <div style={dtStyles.headerRow}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                <span style={{ fontSize: '20px' }}>💎</span>
                                <div>
                                    <h3 style={dtStyles.title}>3D DIGITAL TWIN INSPECTION TOOL</h3>
                                    <p style={dtStyles.subtitle}>
                                        3D Procedural Telemetry View (From Recorded Detection Database)
                                    </p>
                                </div>
                            </div>

                            <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                                {allDefectsList.length > 0 && (
                                    <select
                                        value={defectData ? (defectData.raw_id || defectData.id) : ''}
                                        onChange={(e) => {
                                            const targetId = parseInt(e.target.value, 10);
                                            if (targetId) {
                                                setLoading(true);
                                                fetch(`/api/defects/${targetId}`)
                                                    .then(r => r.json())
                                                    .then(d => { setDefectData(d); setLoading(false); })
                                                    .catch(err => console.error("Error switching defect:", err));
                                            }
                                        }}
                                        style={{
                                            background: '#0F172A', color: '#00F2FE', border: '1px solid #00F2FE',
                                            borderRadius: '6px', padding: '5px 10px', fontSize: '11px', fontFamily: 'Orbitron',
                                            cursor: 'pointer', outline: 'none'
                                        }}
                                    >
                                        {allDefectsList.map(d => (
                                            <option key={d.id} value={d.raw_id || d.id}>
                                                {d.id || `DEF-${d.raw_id}`} - {(d.type || 'DEFECT').toUpperCase()} ({d.severity}) | {d.corridor || 'MG Road'}
                                            </option>
                                        ))}
                                    </select>
                                )}
                                <button onClick={onClose} style={dtStyles.closeBtn}>✕</button>
                            </div>
                        </div>


                        {/* EMPTY STATE WARNING */}
                        {!defectData && !loading && (
                            <div style={dtStyles.emptyStateContainer}>
                                <div style={{ fontSize: '36px', marginBottom: '12px' }}>📍</div>
                                <h4 style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '16px', marginBottom: '8px' }}>
                                    NO DEFECT SELECTED FOR 3D INSPECTION
                                </h4>
                                <p style={{ color: '#9CA3AF', fontSize: '13px', maxWidth: '440px', margin: '0 auto 16px auto' }}>
                                    Click any marker on the map to inspect a defect in 3D.
                                </p>
                                <button onClick={onClose} style={dtStyles.closeModalBtn}>
                                    Return to Map
                                </button>
                            </div>
                        )}

                        {/* LOADING STATE */}
                        {loading && (
                            <div style={dtStyles.loadingContainer}>
                                <div style={dtStyles.spinner} />
                                <span style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '12px', marginTop: '12px' }}>

                                            <span style={{
                                                background: SEVERITY_COLORS[defectData.severity] || '#00F2FE',

                                            <div><span style={dtStyles.metaKey}>Width:</span> <b style={{ color: '#f59e0b' }}>{widthCm} cm</b></div>

                                            <div><span style={dtStyles.metaKey}>Repair Est.:</span> <b style={{ color: '#10b981' }}>${repairCostEst}</b></div>

                                        <div style={{ fontSize: '10px', color: '#9CA3AF', marginTop: '6px', borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '4px' }}>
                                            📍 {defectData.road_name || 'Golden Gate Park Route'} ({defectData.lat ? defectData.lat.toFixed(5) : 37.7699}, {defectData.lng ? defectData.lng.toFixed(5) : -122.4668})

                                    {/* 3D MEASUREMENT LABELS OVERLAY */}

                                            ↕ Depth: {depthCm} cm
                                        </div>
                                    )}
                                    {showLabels && labelCoords.width.visible && (
                                        <div style={{ ...dtStyles.labelBox, top: `${labelCoords.width.y}px`, left: `${labelCoords.width.x}px`, borderColor: '#f59e0b' }}>
                                            ↔ Width: {widthCm} cm
                                        </div>
                                    )}
                                    {showLabels && labelCoords.length.visible && (
                                        <div style={{ ...dtStyles.labelBox, top: `${labelCoords.length.y}px`, left: `${labelCoords.length.x}px`, borderColor: '#10b981' }}>
                                            ⇕ Length: {lengthCm} cm

                                    {/* INTERACTIVE MEASUREMENT TOOL RESULT */}
                                    {isMeasuring && (
                                        <div style={dtStyles.measureNotice}>

                                            {measurePoints.length === 1 && <div>Point 1 selected. Click Point 2...</div>}

                                                    Measured 3D Distance: {measuredDistance} cm
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* COMPARISON PANEL OVERLAY */}
                                    {compareMode && (
                                        <div style={dtStyles.comparePanel}>
                                            <div style={{ fontFamily: 'Orbitron', color: '#f59e0b', fontSize: '11px', fontWeight: 'bold', marginBottom: '4px' }}>
                                                🔄 HISTORICAL COMPARISON MODE
                                            </div>
                                            <div style={{ fontSize: '10px', color: '#E5E7EB' }}>
                                                {nearbyDefects.length > 0 ? (

                                            </div>
                                        </div>

                                </div>

                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '12px', fontSize: '11px', color: '#9CA3AF' }}>

                                    <span>Recorded Timestamp: {defectData.timestamp || 'Live Stream'}</span>
                                </div>
                            </div>

        const dtStyles = {
            overlay: {

            title: { fontFamily: 'Orbitron', color: '#00F2FE', margin: 0, fontSize: '17px', letterSpacing: '1px' },
            subtitle: { fontSize: '11px', color: '#9CA3AF', margin: '4px 0 0 0' },
            closeBtn: { background: 'transparent', border: 'none', color: '#ef4444', fontSize: '22px', cursor: 'pointer', padding: '0 4px' },
            emptyStateContainer: { textAlign: 'center', padding: '60px 20px' },
            closeModalBtn: {
                background: 'linear-gradient(135deg, #0284c7 0%, #00F2FE 100%)', color: '#0B0F19', border: 'none',
                padding: '8px 20px', borderRadius: '6px', fontFamily: 'Orbitron', fontSize: '12px', fontWeight: 'bold', cursor: 'pointer'
            },
            loadingContainer: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: '360px' },
            spinner: { width: '36px', height: '36px', border: '3px solid rgba(0,242,254,0.2)', borderTop: '3px solid #00F2FE', borderRadius: '50%', animation: 'spin 1s linear infinite' },
            toolbar: {
                position: 'absolute', top: '12px', right: '12px', display: 'flex', gap: '6px', zIndex: 100
            },
            toolBtn: {
                background: 'rgba(15, 23, 42, 0.85)', color: '#E5E7EB', border: '1px solid rgba(0, 242, 254, 0.3)',
                borderRadius: '6px', padding: '6px 10px', fontSize: '11px', fontFamily: 'Orbitron', cursor: 'pointer',
                backdropFilter: 'blur(8px)', transition: 'all 0.2s ease'
            },
            telemetryPanel: {

            },
            metaGrid: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '6px', fontSize: '11px', color: '#E5E7EB' },
            metaKey: { color: '#9CA3AF' },
            labelBox: {
                position: 'absolute', transform: 'translate(-50%, -100%)', background: 'rgba(11, 15, 25, 0.92)',
                border: '1px solid', borderRadius: '4px', padding: '3px 8px', fontSize: '10px',
                fontFamily: 'Orbitron', color: '#E5E7EB', zIndex: 120, pointerEvents: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.5)'
            },
            measureNotice: {
                position: 'absolute', bottom: '14px', left: '12px', background: 'rgba(11, 15, 25, 0.92)',
                border: '1px solid #00F2FE', borderRadius: '8px', padding: '8px 14px', fontSize: '11px',
                fontFamily: 'Orbitron', color: '#E5E7EB', zIndex: 120
            },
            comparePanel: {

                border: '1px solid #f59e0b', borderRadius: '8px', padding: '10px 14px', fontSize: '11px',
                maxWidth: '280px', zIndex: 120
            }
        };

        // --- MAIN MAP VIEW COMPONENT ---
        function MainMapView() {
            const [defects, setDefects] = useState([]);
            const [filteredDefects, setFilteredDefects] = useState([]);
            const [selectedDefect, setSelectedDefect] = useState(null);
            const [showTwinModal, setShowTwinModal] = useState(false);
            const [activeTwinDefectId, setActiveTwinDefectId] = useState(null);
            const [hoveredDefect, setHoveredDefect] = useState(null);
            const [zoomLevel, setZoomLevel] = useState(13.2);

            const [layersConfig, setLayersConfig] = useState({
                baseMap: true,
                defects: true,
                heatmap: false,
                trajectory: false,
                municipality: false
            });

            const [filterSeverity, setFilterSeverity] = useState('ALL');
            const [filterType, setFilterType] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');

            const [kpiStats, setKpiStats] = useState({ total: 0, critical: 0, high: 0, medium: 0, low: 0, repaired: 0 });

            const mapContainerRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const mapMarkersRef = useRef([]);

            // 1. Fetch Defects Data from SQLite database
            useEffect(() => {
                fetch('/api/map/defects?limit=10000')
                    .then(res => res.json())
                    .then(data => {
                        if (data.defects) {
                            setDefects(data.defects);
                            setFilteredDefects(data.defects);
                        }
                    })
                    .catch(err => console.error("Error fetching defects from DB:", err));
            }, []);

            // 2. MapLibre GL JS Basemap (Default Center: Bengaluru, India)
            useEffect(() => {
                if (!mapContainerRef.current || mapInstanceRef.current) return;
                if (!window.maplibregl) return;

                const map = new window.maplibregl.Map({
                    container: mapContainerRef.current,
                    style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
                    center: [77.5946, 12.9716], // Bengaluru, India (MG Road / Cubbon Park Corridor)
                    zoom: 13.5,
                    pitch: 40,
                    bearing: 0,
                    attributionControl: false
                });

                map.addControl(new window.maplibregl.AttributionControl({
                    compact: true,
                    customAttribution: 'MAP DATA © OpenStreetMap contributors, © CARTO'
                }), 'bottom-right');

                map.addControl(new window.maplibregl.NavigationControl(), 'top-right');

                map.on('zoom', () => {
                    setZoomLevel(Math.round(map.getZoom() * 10) / 10);
                });

                mapInstanceRef.current = map;

                return () => {
                    if (mapInstanceRef.current) {
                        mapInstanceRef.current.remove();
                        mapInstanceRef.current = null;
                    }
                };
            }, []);

            // 3. Render Native MapLibre Markers & Auto-Fit Bounds to Actual Defects
            useEffect(() => {
                if (!mapInstanceRef.current || !window.maplibregl) return;

                // Clear previous markers
                mapMarkersRef.current.forEach(m => m.remove());
                mapMarkersRef.current = [];

                if (!layersConfig.defects || filteredDefects.length === 0) return;

                const bounds = new window.maplibregl.LngLatBounds();
                let validCount = 0;

                filteredDefects.forEach(d => {
                    if (!d.lat || !d.lng || (d.lat === 0 && d.lng === 0)) return;

                    const isSelected = selectedDefect && (selectedDefect.id === d.id || selectedDefect.raw_id === d.raw_id);
                    const color = SEVERITY_COLORS[d.severity] || SEVERITY_COLORS.Low;
                    const dotSize = Math.max(Math.min((d.depth_cm || 5) * 1.6, 22), 12);

                    const el = document.createElement('div');
                    el.style.width = `${dotSize}px`;
                    el.style.height = `${dotSize}px`;
                    el.style.borderRadius = '50%';
                    el.style.backgroundColor = color;
                    el.style.boxShadow = isSelected ? `0 0 20px ${color}, 0 0 0 3px #ffffff` : `0 0 10px ${color}`;
                    el.style.cursor = 'pointer';
                    el.style.transition = 'all 0.2s ease';

                    const popupContent = `
                        <div style="font-family: Inter, sans-serif; font-size: 11px; padding: 4px; color: #E5E7EB; background: #0B0F19;">
                            <b style="color: #00F2FE;">${d.formatted_id || d.id}</b> | <b>${(d.type || 'DEFECT').toUpperCase()}</b><br/>
                            <span style="color: ${color}; font-weight: bold;">${d.severity} Severity</span> | Depth: ${d.depth_cm || 5} cm
                        </div>
                    `;
                    const popup = new window.maplibregl.Popup({ offset: 12, closeButton: false })
                        .setHTML(popupContent);

                    const marker = new window.maplibregl.Marker({ element: el })
                        .setLngLat([d.lng, d.lat])
                        .setPopup(popup)
                        .addTo(mapInstanceRef.current);

                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        setSelectedDefect(d);
                    });

                    mapMarkersRef.current.push(marker);
                    bounds.extend([d.lng, d.lat]);
                    validCount++;
                });

                if (validCount > 0 && mapInstanceRef.current) {
                    mapInstanceRef.current.fitBounds(bounds, { padding: 80, maxZoom: 16 });
                }
            }, [filteredDefects, selectedDefect, layersConfig.defects]);

            // 4. Filter Defects & Update KPIs
            useEffect(() => {
                let filtered = defects.filter(d => {
                    if (filterSeverity !== 'ALL' && d.severity !== filterSeverity) return false;
                    if (filterType !== 'ALL' && d.type !== filterType) return false;
                    if (searchQuery.trim() !== '') {
                        const q = searchQuery.toLowerCase();
                        const matchId = String(d.id).toLowerCase().includes(q) || (d.formatted_id && d.formatted_id.toLowerCase().includes(q));
                        const matchCorridor = d.corridor ? d.corridor.toLowerCase().includes(q) : false;
                        if (!matchId && !matchCorridor) return false;
                    }
                    return true;
                });

                setFilteredDefects(filtered);

                const stats = { total: filtered.length, critical: 0, high: 0, medium: 0, low: 0, repaired: 0 };
                filtered.forEach(d => {
                    if (d.repair_status === 'Repaired') stats.repaired++;
                    else if (d.severity === 'Critical') stats.critical++;
                    else if (d.severity === 'High') stats.high++;
                    else if (d.severity === 'Medium') stats.medium++;
                    else if (d.severity === 'Low') stats.low++;
                });
                setKpiStats(stats);
            }, [defects, filterSeverity, filterType, searchQuery]);

            const open3DTwinModal = (defectObj) => {
                if (defectObj) {
                    setSelectedDefect(defectObj);
                    setActiveTwinDefectId(defectObj.raw_id || defectObj.id);
                } else {
                    setActiveTwinDefectId(null);
                }
                setShowTwinModal(true);
            };

            return (
                <div style={{ width: '100%', height: '100%', position: 'relative', background: '#0B0F19' }}>

                    {/* KPI SUMMARY CARDS */}
                    <div style={styles.kpiContainer}>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>TOTAL</span>
                            <span style={{ ...styles.kpiValue, color: '#00F2FE' }}>{kpiStats.total}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>CRITICAL</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.Critical }}>{kpiStats.critical}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>HIGH</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.High }}>{kpiStats.high}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>MEDIUM</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.Medium }}>{kpiStats.medium}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>LOW</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.Low }}>{kpiStats.low}</span>
                        </div>
                        <div style={styles.kpiCard}>
                            <span style={styles.kpiLabel}>REPAIRED</span>
                            <span style={{ ...styles.kpiValue, color: SEVERITY_COLORS.Repaired }}>{kpiStats.repaired}</span>
                        </div>
                    </div>

                    {/* FILTER CONTROLS BAR */}
                    <div style={styles.filterBar}>
                        <div style={styles.filterGroup}>
                            <span style={styles.filterLabel}>SEVERITY:</span>
                            <select value={filterSeverity} onChange={(e) => setFilterSeverity(e.target.value)} style={styles.selectInput}>
                                <option value="ALL">All Severities</option>
                                <option value="Critical">Critical</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>

                        <div style={styles.filterGroup}>
                            <span style={styles.filterLabel}>TYPE:</span>
                            <select value={filterType} onChange={(e) => setFilterType(e.target.value)} style={styles.selectInput}>
                                <option value="ALL">All Types</option>
                                <option value="pothole">Pothole</option>
                                <option value="crack">Crack</option>
                                <option value="speedbump">Speedbump</option>
                            </select>
                        </div>

                        <div style={{ flex: 1, minWidth: '180px' }}>
                            <input
                                type="text"
                                placeholder="Search by Defect ID..."
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                                style={styles.searchInput}
                            />
                        </div>

                        <button onClick={() => open3DTwinModal(selectedDefect)} style={styles.twinBtn}>
                            💎 3D DIGITAL TWIN
                        </button>
                    </div>

                    {/* MAPLIBRE BASE MAP VIEWPORT */}
                    <div ref={mapContainerRef} id="map-container">
                        {/* EMPTY STATE WARNING IF NO DETECTIONS */}
                        {filteredDefects.length === 0 && (
                            <div style={styles.emptyStateNotice}>
                                ℹ️ No defect detections recorded yet. Run Simulation Drive or upload a video to record detections.
                            </div>
                        )}
                    </div>


                    {/* LEGEND */}
                    <div style={styles.legendCard}>
                        <div style={styles.legendTitle}>LEGEND</div>
                        <div style={styles.legendRow}><span style={{ ...styles.legendDot, background: SEVERITY_COLORS.Critical }} /> Critical ({kpiStats.critical})</div>
                        <div style={styles.legendRow}><span style={{ ...styles.legendDot, background: SEVERITY_COLORS.High }} /> High ({kpiStats.high})</div>
                        <div style={styles.legendRow}><span style={{ ...styles.legendDot, background: SEVERITY_COLORS.Medium }} /> Medium ({kpiStats.medium})</div>
                        <div style={styles.legendRow}><span style={{ ...styles.legendDot, background: SEVERITY_COLORS.Low }} /> Low ({kpiStats.low})</div>
                    </div>

                    {/* LAYER SIDEBAR */}
                    <div style={styles.layerSidebar}>
                        <div style={styles.sidebarTitle}>LAYERS</div>
                        <label style={styles.layerCheckboxRow}>
                            <input
                                type="checkbox"
                                checked={layersConfig.baseMap}
                                onChange={() => setLayersConfig({ ...layersConfig, baseMap: !layersConfig.baseMap })}
                                style={{ accentColor: '#00F2FE' }}
                            />
                            Base Map
                        </label>
                        <label style={styles.layerCheckboxRow}>
                            <input
                                type="checkbox"
                                checked={layersConfig.defects}
                                onChange={() => setLayersConfig({ ...layersConfig, defects: !layersConfig.defects })}
                                style={{ accentColor: '#00F2FE' }}
                            />
                            Defects (markers)
                        </label>
                    </div>

                    {/* DETAIL DRAWER */}
                    {selectedDefect && (
                        <div style={styles.detailDrawer}>
                            <div style={styles.drawerHeader}>
                                <h3 style={{ margin: 0, fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '15px' }}>
                                    DEFECT #{selectedDefect.id}
                                </h3>
                                <button onClick={() => setSelectedDefect(null)} style={styles.closeDrawerBtn}>✕</button>
                            </div>

                            <div style={styles.drawerBody}>
                                <div style={styles.drawerRow}>
                                    <span style={styles.drawerMetaLabel}>Type:</span>
                                    <b>{selectedDefect.type.toUpperCase()}</b>
                                </div>
                                <div style={styles.drawerRow}>
                                    <span style={styles.drawerMetaLabel}>Severity:</span>
                                    <b style={{ color: SEVERITY_COLORS[selectedDefect.severity] || '#00F2FE' }}>
                                        {selectedDefect.severity.toUpperCase()}
                                    </b>
                                </div>
                                <div style={styles.drawerRow}>
                                    <span style={styles.drawerMetaLabel}>Depth:</span>
                                    <b>{selectedDefect.depth_cm} cm</b>
                                </div>
                                <div style={styles.drawerRow}>
                                    <span style={styles.drawerMetaLabel}>GPS:</span>
                                    <span>{selectedDefect.lat.toFixed(5)}, {selectedDefect.lng.toFixed(5)}</span>
                                </div>

                                <div style={{ borderTop: '1px solid rgba(255,255,255,0.1)', margin: '10px 0' }} />

                                <button onClick={() => open3DTwinModal(selectedDefect)} style={styles.drawerActionBtnPrimary}>
                                    💎 INSPECT IN 3D
                                </button>
                            </div>
                        </div>
                    )}

                    {/* DIGITAL TWIN MODAL */}
                    {showTwinModal && (
                        <DigitalTwinModal
                            defect={selectedDefect}
