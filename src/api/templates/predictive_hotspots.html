<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeDrive AI - Predictive Hotspot Detection (30-Day ML)</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- MapLibre GL JS & Leaflet MapLibre Plugin for OpenFreeMap -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js"></script>

    <!-- Three.js & OrbitControls CDN for 3D Pothole Demo -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-dark: #0B0F19;
            --panel-bg: rgba(11, 15, 25, 0.92);
            --cyan: #00F2FE;
            --yellow: #eab308;
            --orange: #f59e0b;
            --red: #ef4444;
            --green: #10b981;
            --blue: #3b82f6;
            --purple: #a855f7;
            --text-main: #E5E7EB;
            --text-dim: #9CA3AF;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Header Nav */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 24px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            background: rgba(11, 15, 25, 0.95);
            z-index: 1000;
            height: 56px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        .header .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .header .brand-text {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: rgba(17, 24, 39, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: var(--text-dim);
            padding: 5px 12px;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .tab-btn:hover {
            border-color: var(--cyan);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: rgba(0, 242, 254, 0.15);
            border-color: var(--cyan);
            color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
            font-weight: bold;
        }

        #app-root {
            margin-top: 56px;
            padding: 20px;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        .kpi-ribbon {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .kpi-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 10px;
            padding: 14px 18px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .kpi-label {
            font-family: var(--font-display);
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .kpi-value {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: bold;
            margin-top: 4px;
        }

        .kpi-subtext {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 460px;
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .map-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 16px;
            position: relative;
            height: 700px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .map-title {
            font-family: var(--font-display);
            font-size: 14px;
            color: var(--cyan);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #hotspot-map {
            width: 100%;
            flex: 1;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 254, 0.2);
            z-index: 10;
            background: #090D16;
        }

        .sidebar-card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 13px;
            color: var(--cyan);
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(0, 242, 254, 0.2);
            padding-bottom: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .feature-bar-row {
            margin-bottom: 10px;
        }

        .feature-bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .feature-bar-bg {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .feature-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        .table-container {
            max-height: 340px;
            overflow-y: auto;
        }

        table.hotspot-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        table.hotspot-table th {
            font-family: var(--font-display);
            color: var(--text-dim);
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            background: #0B0F19;
            font-size: 10px;
            z-index: 5;
        }

        table.hotspot-table td {
            padding: 8px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .risk-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-family: var(--font-display);
            font-weight: bold;
            font-size: 10px;
            display: inline-block;
        }

        .badge-critical { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
        .badge-high { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
        .badge-medium { background: rgba(234, 179, 8, 0.2); color: #eab308; border: 1px solid #eab308; }

        .btn-dispatch {
            background: linear-gradient(135deg, #0284c7 0%, #00F2FE 100%);
            color: #0B0F19;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            white-space: nowrap;
        }

        .btn-dispatch:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }

        .btn-dispatched-active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: bold;
            cursor: default;
        }

        .btn-3d-demo {
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
            border: 1px solid #a855f7;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-left: 4px;
        }

        .btn-3d-demo:hover {
            background: #a855f7;
            color: #0B0F19;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .leaflet-container {
            background: #0B0F19 !important;
        }

        /* Modal overlay styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 8, 15, 0.88);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }

        .modal-card {
            background: #0B0F19;
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            width: 680px;
            max-width: 92vw;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-3d-card {
            background: #0B0F19;
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            width: 900px;
            max-width: 95vw;
        }

        .pulsing-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px currentColor;
            animation: pulse-dot-anim 1.5s infinite alternate;
        }

        @keyframes pulse-dot-anim {
            0% { transform: scale(0.8); opacity: 0.7; }
            100% { transform: scale(1.3); opacity: 1; }
        }
    </style>
</head>

<body>

    <!-- Header Nav -->
    <div class="header">
        <div class="brand-title" onclick="window.location.href='/'">
            <span class="brand-text">SafeDrive AI</span>
        </div>

        <div class="nav-tabs">
            <a href="/" class="tab-btn">Simulation Drive</a>
            <a href="/map" class="tab-btn">HD Map View</a>
            <a href="/work-orders" class="tab-btn">Work Orders</a>
            <a href="/fleet" class="tab-btn">Multi-Vehicle Fleet</a>
            <a href="/route-advisor" class="tab-btn">Route Advisor</a>
            <a href="/analytics" class="tab-btn">Analytics</a>
            <a href="/predictive-hotspots" class="tab-btn active">Predictive Hotspot Detection</a>
        </div>

        <div>
            <a href="/logout" class="tab-btn" style="border-color: var(--red); color: var(--red);">LOGOUT</a>
        </div>
    </div>

    <!-- React App Mounting Node -->
    <div id="app-root"></div>

    {% raw %}
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- PRE-DISPATCH ADVANCED OPERATIONAL MODAL ---
        function PreDispatchModal({ hotspot, onClose, onDispatchSuccess }) {
            const [crew, setCrew] = useState('Crew Alpha - Rapid Asphalt Unit (Marathahalli Depot)');
            const [priority, setPriority] = useState(hotspot.risk_level === 'CRITICAL' ? 'P1 - CRITICAL (4h Response)' : 'P2 - HIGH (24h Window)');
            const [actionType, setActionType] = useState(
                hotspot.predicted_risk_pct >= 75
                    ? 'Subgrade Bitumen Injection & Structural Micro-Surfacing'
                    : 'Cold-Mix Asphalt Patching & Edge Sealant'
            );
            const [scheduleWindow, setScheduleWindow] = useState('Night Shift (10 PM - 5 AM - Low Traffic)');
            const [equipment, setEquipment] = useState('Hot-Mix Recycler Trailer #3 + Vibratory Roller');
            const [notes, setNotes] = useState(`Preventive maintenance auto-generated for ${hotspot.corridor}. Target: Prevent 30-day predicted subgrade failure.`);
            const [isSubmitting, setIsSubmitting] = useState(false);

            const prevCost = Math.round(hotspot.predicted_risk_pct * 8 + 320);
            const reactiveSavings = Math.round(prevCost * 8.5);
            const netSavings = reactiveSavings - prevCost;

            const handleConfirmDispatch = () => {
                setIsSubmitting(true);
                const woCode = `WO-PRE-2026-${Math.floor(1000 + Math.random() * 9000)}`;

                fetch('/api/work_orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        obstacle_id: 9000 + Math.floor(Math.random() * 500),
                        type: 'PREVENTIVE_POTHOLE_HOTSPOT',
                        description: `[PRE-DISPATCH ${woCode}] Corridor: ${hotspot.corridor} (${hotspot.grid_id}). Action: ${actionType}. Risk: ${hotspot.predicted_risk_pct}%. Crew: ${crew}. Equipment: ${equipment}. Notes: ${notes}`,
                        assigned_driver: crew
                    })
                })
                .then(res => res.json())
                .then(data => {
                    setIsSubmitting(false);
                    onDispatchSuccess(hotspot, woCode, crew, netSavings);
                })
                .catch(err => {
                    setIsSubmitting(false);
                    alert("Dispatch completed with warning: " + err);
                    onDispatchSuccess(hotspot, woCode, crew, netSavings);
                });
            };

            return (
                <div class="modal-overlay">
                    <div class="modal-card">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '16px' }}>
                            <div>
                                <h3 style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '16px', margin: 0, letterSpacing: '1px' }}>
                                    ⚡ PRE-DISPATCH PREVENTIVE WORK ORDER
                                </h3>
                                <p style={{ fontSize: '11px', color: '#9CA3AF', marginTop: '4px' }}>
                                    Preventive Crew Deployment & Resource Allocation — {hotspot.grid_id} ({hotspot.corridor})
                                </p>
                            </div>
                            <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: '#ef4444', fontSize: '20px', cursor: 'pointer' }}>✕</button>
                        </div>

                        {/* HOTSPOT SUMMARY METRICS */}
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px', background: 'rgba(15, 23, 42, 0.8)', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '8px', padding: '10px', marginBottom: '16px' }}>
                            <div>
                                <div style={{ fontSize: '9px', fontFamily: 'Orbitron', color: '#9CA3AF' }}>30-DAY RISK</div>
                                <div style={{ fontSize: '15px', fontFamily: 'Orbitron', fontWeight: 'bold', color: hotspot.predicted_risk_pct >= 75 ? '#ef4444' : '#f59e0b' }}>
                                    {hotspot.predicted_risk_pct}%
                                </div>
                            </div>
                            <div>
                                <div style={{ fontSize: '9px', fontFamily: 'Orbitron', color: '#9CA3AF' }}>TRAFFIC VPD</div>
                                <div style={{ fontSize: '15px', fontFamily: 'Orbitron', fontWeight: 'bold', color: '#00F2FE' }}>
                                    {hotspot.traffic_vpd.toLocaleString()}
                                </div>
                            </div>
                            <div>
                                <div style={{ fontSize: '9px', fontFamily: 'Orbitron', color: '#9CA3AF' }}>DEFECT DENSITY</div>
                                <div style={{ fontSize: '15px', fontFamily: 'Orbitron', fontWeight: 'bold', color: '#eab308' }}>
                                    {hotspot.past_defect_density} /km²
                                </div>
                            </div>
                            <div>
                                <div style={{ fontSize: '9px', fontFamily: 'Orbitron', color: '#9CA3AF' }}>ROAD CLASS</div>
                                <div style={{ fontSize: '13px', fontFamily: 'Orbitron', fontWeight: 'bold', color: '#E5E7EB', marginTop: '2px' }}>
                                    {hotspot.road_type}
                                </div>
                            </div>
                        </div>

                        {/* PRE-DISPATCH FORM OPTIONS */}
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '14px', marginBottom: '16px' }}>
                            <div>
                                <label style={{ display: 'block', fontSize: '10px', fontFamily: 'Orbitron', color: '#00F2FE', marginBottom: '4px' }}>
                                    RECOMMENDED PREVENTIVE ACTION:
                                </label>
                                <select
                                    value={actionType}
                                    onChange={e => setActionType(e.target.value)}
                                    style={{ width: '100%', background: '#0F172A', color: '#E5E7EB', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '6px', padding: '8px', fontSize: '11px' }}
                                >
                                    <option value="Subgrade Bitumen Injection & Structural Micro-Surfacing">Subgrade Bitumen Injection & Micro-Surfacing</option>
                                    <option value="Cold-Mix Asphalt Patching & Edge Sealant">Cold-Mix Asphalt Patching & Edge Sealant</option>
                                    <option value="Full Corridor Milling & Paving Overlay">Full Corridor Milling & Paving Overlay</option>
                                    <option value="Crack Sealing & Drainage Sub-layer Clearance">Crack Sealing & Drainage Sub-layer Clearance</option>
                                </select>
                            </div>

                            <div>
                                <label style={{ display: 'block', fontSize: '10px', fontFamily: 'Orbitron', color: '#00F2FE', marginBottom: '4px' }}>
                                    ASSIGNED MAINTENANCE CREW:
                                </label>
                                <select
                                    value={crew}
                                    onChange={e => setCrew(e.target.value)}
                                    style={{ width: '100%', background: '#0F172A', color: '#E5E7EB', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '6px', padding: '8px', fontSize: '11px' }}
                                >
                                    <option value="Crew Alpha - Rapid Asphalt Unit (Marathahalli Depot)">Crew Alpha - Rapid Asphalt Unit (Marathahalli)</option>
                                    <option value="Crew Beta - Heavy Subgrade Repair (Hebbal Depot)">Crew Beta - Heavy Subgrade Repair (Hebbal)</option>
                                    <option value="Crew Gamma - Emergency Patching Unit (Silk Board)">Crew Gamma - Emergency Patching Unit (Silk Board)</option>
                                    <option value="Crew Delta - Paving & Milling Team (Whitefield)">Crew Delta - Paving & Milling Team (Whitefield)</option>
                                </select>
                            </div>

                            <div>
                                <label style={{ display: 'block', fontSize: '10px', fontFamily: 'Orbitron', color: '#00F2FE', marginBottom: '4px' }}>
                                    PRIORITY LEVEL & RESPONSE SLA:
                                </label>
                                <select
                                    value={priority}
                                    onChange={e => setPriority(e.target.value)}
                                    style={{ width: '100%', background: '#0F172A', color: '#E5E7EB', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '6px', padding: '8px', fontSize: '11px' }}
                                >
                                    <option value="P1 - CRITICAL (4h Response)">P1 - CRITICAL (Immediate 4h Dispatch)</option>
                                    <option value="P2 - HIGH (24h Window)">P2 - HIGH (24h Scheduled Window)</option>
                                    <option value="P3 - PREVENTIVE (48h Window)">P3 - PREVENTIVE (48h Planned Window)</option>
                                </select>
                            </div>

                            <div>
                                <label style={{ display: 'block', fontSize: '10px', fontFamily: 'Orbitron', color: '#00F2FE', marginBottom: '4px' }}>
                                    SCHEDULED EXECUTION SHIFT:
                                </label>
                                <select
                                    value={scheduleWindow}
                                    onChange={e => setScheduleWindow(e.target.value)}
                                    style={{ width: '100%', background: '#0F172A', color: '#E5E7EB', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '6px', padding: '8px', fontSize: '11px' }}
                                >
                                    <option value="Night Shift (10 PM - 5 AM - Low Traffic)">Night Shift (10 PM - 5 AM - Low Traffic)</option>
                                    <option value="Morning Shift (6 AM - 2 PM)">Morning Shift (6 AM - 2 PM)</option>
                                    <option value="Immediate Emergency Dispatch">Immediate Emergency Dispatch</option>
                                </select>
                            </div>
                        </div>

                        {/* EQUIPMENT & MATERIAL ALLOCATION */}
                        <div style={{ marginBottom: '14px' }}>
                            <label style={{ display: 'block', fontSize: '10px', fontFamily: 'Orbitron', color: '#00F2FE', marginBottom: '4px' }}>
                                HEAVY MACHINERY & MATERIAL ALLOCATION:
                            </label>
                            <input
                                type="text"
                                value={equipment}
                                onChange={e => setEquipment(e.target.value)}
                                style={{ width: '100%', background: '#0F172A', color: '#E5E7EB', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '6px', padding: '8px', fontSize: '11px' }}
                            />
                        </div>

                        {/* DISPATCHER NOTES */}
                        <div style={{ marginBottom: '16px' }}>
                            <label style={{ display: 'block', fontSize: '10px', fontFamily: 'Orbitron', color: '#00F2FE', marginBottom: '4px' }}>
                                FIELD INSTRUCTIONS / DISPATCHER NOTES:
                            </label>
                            <textarea
                                value={notes}
                                onChange={e => setNotes(e.target.value)}
                                rows={2}
                                style={{ width: '100%', background: '#0F172A', color: '#E5E7EB', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '6px', padding: '8px', fontSize: '11px', resize: 'none' }}
                            />
                        </div>

                        {/* FINANCIAL SAVINGS PREVIEW CARD */}
                        <div style={{ background: 'rgba(16, 185, 129, 0.1)', border: '1px solid #10b981', borderRadius: '8px', padding: '12px', marginBottom: '18px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                            <div>
                                <div style={{ fontSize: '10px', fontFamily: 'Orbitron', color: '#10b981', fontWeight: 'bold' }}>
                                    💰 FINANCIAL PREVENTIVE SAVINGS ESTIMATE
                                </div>
                                <div style={{ fontSize: '11px', color: '#9CA3AF', marginTop: '2px' }}>
                                    Preventive Pre-Dispatch Cost: <b>${prevCost}</b> vs Avoided Damage Claims: <b>${reactiveSavings}</b>
                                </div>
                            </div>

        // --- 3D HOTSPOT & POTHOLE DEMO DOTS MODAL ---
        function Hotspot3DModal({ hotspot, onClose }) {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const [selectedPothole, setSelectedPothole] = useState(null);

            // Generate procedural demo potholes in 3D for this cell
            const potholeDots = React.useMemo(() => {
                const count = Math.max(3, Math.floor(hotspot.predicted_risk_pct / 18));
                const dots = [];
                const seed = parseInt(hotspot.grid_id.replace('GRID-BG-', ''), 10) || 1;

                for (let i = 0; i < count; i++) {
                    const x = (Math.sin(seed * 7 + i * 3) * 3.8);
                    const z = (Math.cos(seed * 11 + i * 5) * 6.5);
                    const depth = roundVal(4.5 + Math.abs(Math.sin(i * 4)) * 5.2, 1);
                    const width = roundVal(28.0 + Math.abs(Math.cos(i * 3)) * 25.0, 1);
                    const severity = depth > 7.0 ? 'CRITICAL' : (depth > 5.2 ? 'HIGH' : 'MEDIUM');

                    dots.push({
                        id: `#PTH-3D-${hotspot.grid_id.replace('GRID-BG-', '')}-${i+1}`,
                        x, z,
                        depth, width,
                        severity,
                        growthRate: `+${(depth * 0.25).toFixed(1)} cm/wk`,
                        riskFactor: hotspot.risk_factors[i % hotspot.risk_factors.length]
                    });
                }
                return dots;
            }, [hotspot]);

            function roundVal(v, p) {
                const f = Math.pow(10, p);
                return Math.round(v * f) / f;
            }

            useEffect(() => {
                if (!mountRef.current || !window.THREE) return;
                const THREE = window.THREE;
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;

                // 1. Scene
                const scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0a0e17);
                scene.fog = new THREE.FogExp2(0x0a0e17, 0.025);
                sceneRef.current = scene;

                // 2. Camera
                const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                camera.position.set(5.5, 6.0, 9.0);

                // 3. Renderer
                const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
                renderer.setSize(width, height);
                renderer.shadowMap.enabled = true;
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;

                // 4. Orbit Controls
                let controls;
                if (window.THREE.OrbitControls) {
                    controls = new window.THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    controls.maxPolarAngle = Math.PI / 2 - 0.05;
                }

                // 5. Lighting
                scene.add(new THREE.AmbientLight(0x556070, 0.5));
                const sun = new THREE.DirectionalLight(0xffffff, 1.2);
                sun.position.set(10, 20, 10);
                sun.castShadow = true;
                scene.add(sun);

                const spotCyan = new THREE.SpotLight(0x00f2fe, 1.5, 30);
                spotCyan.position.set(-6, 12, 6);
                scene.add(spotCyan);

                // 6. Road Surface Mesh (10m x 18m)
                const roadGeo = new THREE.PlaneGeometry(10, 18, 100, 100);
                roadGeo.rotateX(-Math.PI / 2);

                const pos = roadGeo.attributes.position;
                const colors = [];
                const baseColor = new THREE.Color(0x222834);
                const pitColor = new THREE.Color(0x0a0d12);

                for (let i = 0; i < pos.count; i++) {
                    const vx = pos.getX(i);
                    const vz = pos.getZ(i);

                    let dispY = 0.0;
                    let col = baseColor.clone();

                    potholeDots.forEach(p => {
                        const dx = vx - p.x;
                        const dz = vz - p.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        const radius = (p.width / 100.0) * 0.7;

                        if (dist < radius) {
                            const factor = Math.cos((dist / radius) * (Math.PI / 2));
                            dispY -= (p.depth / 100.0) * Math.pow(factor, 1.4);
                            col.lerp(pitColor, factor * 0.85);
                        }
                    });

                    pos.setY(i, dispY);
                    colors.push(col.r, col.g, col.b);
                }

                roadGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                roadGeo.computeVertexNormals();

                const roadMat = new THREE.MeshStandardMaterial({
                    vertexColors: true,
                    roughness: 0.8,
                    metalness: 0.1
                });
                const roadMesh = new THREE.Mesh(roadGeo, roadMat);
                roadMesh.receiveShadow = true;
                scene.add(roadMesh);

                // Broken Yellow Center Line
                for (let z = -8; z <= 8; z += 2.2) {
                    const dashGeo = new THREE.PlaneGeometry(0.16, 1.2);
                    dashGeo.rotateX(-Math.PI / 2);
                    const dashMat = new THREE.MeshBasicMaterial({ color: 0xeab308 });
                    const dash = new THREE.Mesh(dashGeo, dashMat);
                    dash.position.set(0, 0.005, z);
                    scene.add(dash);
                }

                // 7. RENDER 3D GLOWING DEMO DOTS WHERE POTHOLES ARE
                potholeDots.forEach(p => {
                    const colorHex = p.severity === 'CRITICAL' ? 0xef4444 : (p.severity === 'HIGH' ? 0xf59e0b : 0xeab308);

                    // 3D Sphere Marker Dot
                    const sphereGeo = new THREE.SphereGeometry(0.22, 16, 16);
                    const sphereMat = new THREE.MeshStandardMaterial({
                        color: colorHex,
                        emissive: colorHex,
                        emissiveIntensity: 0.6,
                        roughness: 0.2
                    });
                    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                    sphere.position.set(p.x, 0.28, p.z);
                    scene.add(sphere);

                    // Vertical Light Stem Pillar down into road
                    const stemPoints = [new THREE.Vector3(p.x, 0.0, p.z), new THREE.Vector3(p.x, 0.6, p.z)];
                    const stemGeo = new THREE.BufferGeometry().setFromPoints(stemPoints);
                    const stemMat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2 });
                    scene.add(new THREE.Line(stemGeo, stemMat));

                    // Glowing Surface Ring Target Dot
                    const ringGeo = new THREE.RingGeometry(0.35, 0.42, 32);
                    ringGeo.rotateX(-Math.PI / 2);
                    const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.position.set(p.x, 0.01, p.z);
                    scene.add(ring);
                });

                // Default auto-select first 3D pothole dot
                if (potholeDots.length > 0) setSelectedPothole(potholeDots[0]);

                // Animation loop
                let animId;
                const animate = () => {
                    animId = requestAnimationFrame(animate);
                    if (controls) controls.update();
                    renderer.render(scene, camera);
                };
                animate();

                return () => {
                    cancelAnimationFrame(animId);
                    if (renderer && renderer.domElement && mountRef.current && mountRef.current.contains(renderer.domElement)) {
                        mountRef.current.removeChild(renderer.domElement);
                    }
                    renderer.dispose();
                };
            }, [potholeDots]);

            return (
                <div class="modal-overlay">
                    <div class="modal-3d-card">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '14px' }}>
                            <div>
                                <h3 style={{ fontFamily: 'Orbitron', color: '#a855f7', fontSize: '16px', margin: 0, letterSpacing: '1px' }}>
                                    💎 3D POTHOLE DEMO INSPECTION — {hotspot.grid_id}
                                </h3>
                                <p style={{ fontSize: '11px', color: '#9CA3AF', marginTop: '2px' }}>
                                    Interactive 3D Procedural Surface Model showing exact predicted pothole formation dots on road bed.
                                </p>
                            </div>
                            <button onClick={onClose} style={{ background: 'transparent', border: 'none', color: '#ef4444', fontSize: '20px', cursor: 'pointer' }}>✕</button>
                        </div>

                        {/* 3D CANVAS & SIDEBAR GRID */}
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 280px', gap: '16px' }}>
                            {/* THREE JS CANVAS */}
                            <div
                                ref={mountRef}
                                style={{ width: '100%', height: '440px', borderRadius: '10px', overflow: 'hidden', border: '1px solid rgba(168, 85, 247, 0.4)', position: 'relative' }}
                            >
                                <div style={{ position: 'absolute', top: '10px', left: '10px', background: 'rgba(11, 15, 25, 0.85)', border: '1px solid rgba(168,85,247,0.3)', borderRadius: '6px', padding: '6px 10px', fontSize: '10px', fontFamily: 'Orbitron', color: '#a855f7', zIndex: 10 }}>
                                    🔴 3D DEMO POTHOLE DOTS: {potholeDots.length} CLUSTERED
                                </div>
                            </div>

                            {/* POTHOLE LIST & SELECTED METRICS */}
                            <div style={{ background: 'rgba(15, 23, 42, 0.85)', border: '1px solid rgba(168,85,247,0.3)', borderRadius: '10px', padding: '14px', display: 'flex', flexDirection: 'column', gap: '12px' }}>
                                <div style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '11px', borderBottom: '1px solid rgba(0,242,254,0.2)', paddingBottom: '4px' }}>
                                    📍 DEMO POTHOLE LOCATIONS
                                </div>

                                <div style={{ maxHeight: '180px', overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: '6px' }}>
                                    {potholeDots.map(p => (
                                        <div
                                            key={p.id}
                                            onClick={() => setSelectedPothole(p)}
                                            style={{
                                                background: selectedPothole && selectedPothole.id === p.id ? 'rgba(168,85,247,0.25)' : 'rgba(255,255,255,0.04)',
                                                border: selectedPothole && selectedPothole.id === p.id ? '1px solid #a855f7' : '1px solid transparent',
                                                borderRadius: '6px', padding: '6px 8px', cursor: 'pointer', fontSize: '11px', display: 'flex', justifyContent: 'space-between', alignItems: 'center'
                                            }}
                                        >
                                            <div>
                                                <b style={{ color: p.severity === 'CRITICAL' ? '#ef4444' : '#f59e0b' }}>{p.id}</b>
                                                <div style={{ fontSize: '10px', color: '#9CA3AF' }}>Depth: {p.depth} cm</div>
                                            </div>
                                            <span class={`risk-badge badge-${p.severity.toLowerCase()}`}>{p.severity}</span>
                                        </div>
                                    ))}
                                </div>

                                {selectedPothole && (
                                    <div style={{ background: 'rgba(11, 15, 25, 0.95)', border: '1px solid rgba(168,85,247,0.4)', borderRadius: '8px', padding: '10px', marginTop: 'auto' }}>
                                        <div style={{ fontFamily: 'Orbitron', color: '#a855f7', fontSize: '11px', fontWeight: 'bold', marginBottom: '4px' }}>
                                            {selectedPothole.id} DETAILS
                                        </div>
                                        <div style={{ fontSize: '11px', color: '#E5E7EB', display: 'flex', flexDirection: 'column', gap: '2px' }}>
                                            <div>Severity: <b style={{ color: selectedPothole.severity === 'CRITICAL' ? '#ef4444' : '#f59e0b' }}>{selectedPothole.severity}</b></div>
                                            <div>Depth: <b>{selectedPothole.depth} cm</b> | Width: <b>{selectedPothole.width} cm</b></div>
                                            <div>3D Degradation Rate: <b style={{ color: '#00F2FE' }}>{selectedPothole.growthRate}</b></div>
                                            <div style={{ fontSize: '10px', color: '#9CA3AF', marginTop: '4px' }}>Primary Factor: {selectedPothole.riskFactor}</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN PREDICTIVE HOTSPOTS APPLICATION ---
        function PredictiveHotspotsApp() {
            const [loading, setLoading] = useState(true);
            const [modelInfo, setModelInfo] = useState(null);
            const [summary, setSummary] = useState(null);
            const [hotspots, setHotspots] = useState([]);
            const [selectedCell, setSelectedCell] = useState(null);
            const [filterRisk, setFilterRisk] = useState('ALL');
            const [searchQuery, setSearchQuery] = useState('');
            const [dispatchSuccess, setDispatchSuccess] = useState(null);

            // Modal States
            const [preDispatchTarget, setPreDispatchTarget] = useState(null);
            const [show3DTarget, setShow3DTarget] = useState(null);
            const [dispatchedMap, setDispatchedMap] = useState({});
            const [dispatchedCount, setDispatchedCount] = useState(0);

            const mapRef = useRef(null);
            const mapInstanceRef = useRef(null);
            const layerGroupRef = useRef(null);

            // Fetch ML Predictions from /api/predictive/hotspots
            useEffect(() => {
                fetch('/api/predictive/hotspots')
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') {
                            setModelInfo(data.model_info);
                            setSummary(data.summary);
                            setHotspots(data.hotspots);
                            if (data.hotspots.length > 0) {
                                setSelectedCell(data.hotspots[0]);
                            }
                        }
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error("Error fetching predictive hotspots:", err);
                        setLoading(false);
                    });
            }, []);

            // Initialize Leaflet Map with robust re-initialization safety & auto-fit
            useEffect(() => {
                if (loading || !mapRef.current) return;

                // Safely clear previous Leaflet container ID if present
                if (mapRef.current._leaflet_id) {
                    mapRef.current._leaflet_id = null;
                }

                if (mapInstanceRef.current) {
                    try {
                        mapInstanceRef.current.remove();
                    } catch(e) {}
                    mapInstanceRef.current = null;
                }

                try {
                    const map = L.map(mapRef.current, {
                        center: [12.9400, 77.6300], // Bangalore Outer Ring Road center
                        zoom: 12,
                        zoomControl: true
                    });

                    // 1. Tile provider - OpenFreeMap Vector Dark Style (Zero API Keys required)
                    if (window.L && window.L.maplibreGL) {
                        L.maplibreGL({
                            style: 'https://tiles.openfreemap.org/styles/dark'
                        }).addTo(map);
                    } else {
                        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                            attribution: '&copy; OpenStreetMap',
                            maxZoom: 19
                        }).addTo(map);
                    }

                    const layerGroup = L.layerGroup().addTo(map);
                    layerGroupRef.current = layerGroup;
                    mapInstanceRef.current = map;

                    // Force size recalculations so container renders map instantly
                    const timers = [50, 150, 400, 800].map(delay =>
                        setTimeout(() => { if (map) map.invalidateSize(); }, delay)
                    );

                    return () => {
                        timers.forEach(t => clearTimeout(t));
                        try {
                            map.remove();
                        } catch(e) {}
                        mapInstanceRef.current = null;
                    };
                } catch(err) {
                    console.error("Leaflet map initialization error:", err);
                }
            }, [loading]);

            // Render Grid Cells, Heat Polygons, Road Vectors & Demo Pothole Dots on Map
            useEffect(() => {
                if (!mapInstanceRef.current || !layerGroupRef.current) return;
                const map = mapInstanceRef.current;
                const layerGroup = layerGroupRef.current;
                layerGroup.clearLayers();

                const filtered = hotspots.filter(h => {
                    if (filterRisk === 'CRITICAL' && h.risk_level !== 'CRITICAL') return false;
                    if (filterRisk === 'HIGH' && !['CRITICAL', 'HIGH'].includes(h.risk_level)) return false;
                    if (searchQuery.trim() !== '') {
                        const q = searchQuery.toLowerCase();
                        return h.grid_id.toLowerCase().includes(q) || h.corridor.toLowerCase().includes(q);
                    }
                    return true;
                });

                // Auto-fit map bounds to filtered hotspots if available
                if (filtered.length > 0 && map) {
                    try {
                        const latLngs = filtered.map(h => [h.center_lat, h.center_lng]);
                        const bounds = L.latLngBounds(latLngs);
                        map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
                    } catch(e) {}
                }

                // Render vector road corridor guide lines
                const corridorCenters = [
                    [[12.9150, 77.6250], [12.9250, 77.6850], [12.9850, 77.6950]], // Outer Ring Road
                    [[12.9450, 77.6250], [12.9550, 77.6650], [12.9850, 77.7350]], // Old Airport & Whitefield
                    [[12.8750, 77.6450], [12.9250, 77.6850], [13.0650, 77.5950]]  // Hosur & Bellary Road
                ];
                corridorCenters.forEach(path => {
                    L.polyline(path, {
                        color: '#00F2FE',
                        weight: 2,
                        dashArray: '6, 6',
                        opacity: 0.35
                    }).addTo(layerGroup);
                });

                filtered.forEach(h => {
                    let color = '#ef4444'; // Red
                    let fillOpacity = 0.55;
                    if (h.predicted_risk_pct < 55.0) { color = '#eab308'; fillOpacity = 0.35; }
                    else if (h.predicted_risk_pct < 75.0) { color = '#f59e0b'; fillOpacity = 0.45; }

                    const bounds = [
                        [h.bounds[0][0], h.bounds[0][1]],
                        [h.bounds[1][0], h.bounds[1][1]]
                    ];

                    const isDispatched = dispatchedMap[h.grid_id];

                    // Grid Polygon
                    const polygon = L.rectangle(bounds, {
                        color: isDispatched ? '#10b981' : color,
                        weight: isDispatched ? 2.5 : 1.5,
                        fillColor: isDispatched ? '#10b981' : color,
                        fillOpacity: isDispatched ? 0.35 : fillOpacity
                    });

                    const popupContent = `
                        <div style="font-family: Inter, sans-serif; font-size: 11px; padding: 6px; color: #E5E7EB; max-width: 240px;">
                            <div style="font-family: Orbitron; color: ${isDispatched ? '#10b981' : color}; font-weight: bold; font-size: 12px; margin-bottom: 4px;">
                                ${h.grid_id} | ${h.predicted_risk_pct}% RISK ${isDispatched ? '✅ PRE-DISPATCHED' : ''}
                            </div>
                            <div style="margin-bottom: 4px; font-weight: 600;">${h.corridor}</div>
                            <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid ${color}; padding: 6px; border-radius: 4px; font-size: 10px; margin-bottom: 6px;">
                                🎯 <b>Prediction:</b> ${h.risk_statement}
                            </div>
                            <div style="color: #9CA3AF; font-size: 10px; margin-bottom: 6px;">
                                • Traffic: <b>${h.traffic_vpd.toLocaleString()} VPD</b><br/>
                                • Density: <b>${h.past_defect_density} defects/km²</b><br/>
                                • Road Class: <b>${h.road_type}</b>
                            </div>
                        </div>
                    `;

                    polygon.bindPopup(popupContent);
                    polygon.on('click', () => setSelectedCell(h));
                    layerGroup.addLayer(polygon);

                    // Central Pulsing Glowing Marker
                    const circleMarker = L.circleMarker([h.center_lat, h.center_lng], {
                        radius: Math.max(6, h.predicted_risk_pct / 9),
                        color: isDispatched ? '#10b981' : '#ffffff',
                        weight: 1.8,
                        fillColor: isDispatched ? '#10b981' : color,
                        fillOpacity: 0.90
                    });
                    circleMarker.bindPopup(popupContent);
                    circleMarker.on('click', () => setSelectedCell(h));
                    layerGroup.addLayer(circleMarker);

                    // Render Demo Example Dots where predicted potholes are inside this cell
                    const dotsCount = Math.max(2, Math.floor(h.predicted_risk_pct / 20));
                    for (let i = 0; i < dotsCount; i++) {
                        const dotLat = h.center_lat + (Math.sin(i * 4 + h.center_lat) * 0.0022);
                        const dotLng = h.center_lng + (Math.cos(i * 3 + h.center_lng) * 0.0028);

                        const pDot = L.circleMarker([dotLat, dotLng], {
                            radius: 4.0,
                            color: '#000000',
                            weight: 1.0,
                            fillColor: color,
                            fillOpacity: 0.95
                        });
                        pDot.bindTooltip(`📍 Predicted Pothole Dot #${i+1} (${h.grid_id})`, { direction: 'top' });
                        layerGroup.addLayer(pDot);
                    }
                });

                if (map) {
                    map.invalidateSize();
                }

            }, [hotspots, filterRisk, searchQuery, dispatchedMap]);

            // Handle successful pre-dispatch confirmation
            const handleDispatchSuccess = (hotspotObj, woCode, crewName, savings) => {
                setDispatchedMap(prev => ({ ...prev, [hotspotObj.grid_id]: { woCode, crewName } }));
                setDispatchedCount(prev => prev + 1);
                setPreDispatchTarget(null);
                setDispatchSuccess(`Preventive Work Order ${woCode} Dispatched for ${hotspotObj.corridor}! (${crewName} | +$${savings.toLocaleString()} Savings)`);
                setTimeout(() => setDispatchSuccess(null), 6000);
            };

            // Handle Batch Pre-Dispatch for all Critical Hotspots
            const handleBatchDispatch = () => {
                const criticalCells = hotspots.filter(h => h.risk_level === 'CRITICAL' && !dispatchedMap[h.grid_id]);
                if (criticalCells.length === 0) {
                    alert("All Critical Hotspots are already pre-dispatched!");
                    return;
                }

                if (confirm(`Confirm Batch Pre-Dispatch for ${criticalCells.length} Critical Hotspot Cells?`)) {
                    const newMap = { ...dispatchedMap };
                    criticalCells.forEach((c, idx) => {
                        const code = `WO-PRE-2026-BATCH-${idx+1}`;
                        newMap[c.grid_id] = { woCode: code, crewName: 'Automated Dispatch Unit' };
                    });
                    setDispatchedMap(newMap);
                    setDispatchedCount(prev => prev + criticalCells.length);
                    setDispatchSuccess(`🚀 Batch Pre-Dispatched ${criticalCells.length} Critical Hotspot Cells successfully!`);
                    setTimeout(() => setDispatchSuccess(null), 6000);
                }
            };

            if (loading) {
                return (
                    <div style={{ textAlign: 'center', padding: '120px 20px' }}>
                        <div style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '18px', marginBottom: '12px' }}>
                            🧠 EXECUTING GRADIENT BOOSTING CLASSIFIER & 3D HOTSPOT MAP...
                        </div>
                        <div style={{ color: '#9CA3AF', fontSize: '12px' }}>
                            Evaluating historical defect clusters, traffic volume (VPD), weather indices, and road subgrade degradation.
                        </div>
                    </div>
                );
            }

            return (
                <div>
                    {/* TOP SUMMARY KPI RIBBON */}
                    <div class="kpi-ribbon">
                        <div class="kpi-card">
                            <div class="kpi-label">30-DAY FUTURE HOTSPOTS</div>
                            <div class="kpi-value" style={{ color: '#ef4444' }}>
                                {summary ? summary.critical_hotspots_count : 0} <span style={{ fontSize: '12px', color: '#9CA3AF' }}>cells</span>
                            </div>
                            <div class="kpi-subtext">Grid cells with &ge; 75% 30-day pothole formation risk</div>
                        </div>

                        <div class="kpi-card">
                            <div class="kpi-label">MAX CELL RISK</div>
                            <div class="kpi-value" style={{ color: '#00F2FE' }}>
                                {summary ? summary.max_cell_risk_pct : 0}%
                            </div>
                            <div class="kpi-subtext">Highest predicted 30-day degradation density</div>
                        </div>

                        <div class="kpi-card">
                            <div class="kpi-label">ML MODEL ACCURACY</div>
                            <div class="kpi-value" style={{ color: '#10b981' }}>
                                {modelInfo ? modelInfo.accuracy : 0}%
                            </div>
                            <div class="kpi-subtext">ROC-AUC: {modelInfo ? modelInfo.roc_auc : 0} (GradientBoosting)</div>
                        </div>

                        <div class="kpi-card">
                            <div class="kpi-label">PRE-DISPATCHED CREWS</div>
                            <div class="kpi-value" style={{ color: '#10b981' }}>
                                {dispatchedCount} <span style={{ fontSize: '12px', color: '#9CA3AF' }}>active</span>
                            </div>
                            <div class="kpi-subtext">Preventive maintenance work orders generated</div>
                        </div>
                    </div>

                    {dispatchSuccess && (
                        <div style={{ background: 'rgba(16, 185, 129, 0.2)', border: '1px solid #10b981', color: '#10b981', padding: '12px 18px', borderRadius: '8px', marginBottom: '16px', fontFamily: 'Orbitron', fontSize: '12px' }}>
                            ✅ {dispatchSuccess}
                        </div>
                    )}

                    {/* MAIN TWO-COLUMN LAYOUT */}
                    <div class="main-layout">
                        
                        {/* LEFT COLUMN: INTERACTIVE MAP */}
                        <div class="map-card">
                            <div class="map-header">
                                <div class="map-title">
                                    <span>🔥 PREDICTIVE HOTSPOT HEATMAP</span>
                                    <span style={{ fontSize: '10px', color: '#9CA3AF', fontFamily: 'Inter' }}>
                                        (30-Day Pothole Formation Forecast)
                                    </span>
                                </div>

                                <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', alignItems: 'center' }}>
                                    <input
                                        type="text"
                                        placeholder="Search Corridor / Grid ID..."
                                        value={searchQuery}
                                        onChange={e => setSearchQuery(e.target.value)}
                                        style={{ background: '#0B0F19', color: '#E5E7EB', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '4px', padding: '4px 8px', fontSize: '11px', width: '160px' }}
                                    />
                                    <select
                                        value={filterRisk}
                                        onChange={e => setFilterRisk(e.target.value)}
                                        style={{ background: '#0B0F19', color: '#E5E7EB', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '4px', padding: '4px 8px', fontSize: '11px' }}
                                    >
                                        <option value="ALL">All Grid Cells ({hotspots.length})</option>
                                        <option value="CRITICAL">Critical Risk (&ge;75%)</option>
                                        <option value="HIGH">High & Critical (&ge;55%)</option>
                                    </select>
                                    <button
                                        onClick={handleBatchDispatch}
                                        style={{ background: 'linear-gradient(135deg, #0284c7 0%, #00F2FE 100%)', color: '#0B0F19', border: 'none', padding: '5px 10px', borderRadius: '4px', fontFamily: 'Orbitron', fontSize: '10px', fontWeight: 'bold', cursor: 'pointer' }}
                                    >
                                        ⚡ BATCH PRE-DISPATCH CRITICAL
                                    </button>
                                </div>
                            </div>

                            {/* LEAFLET MAP ELEMENT */}
                            <div id="hotspot-map" ref={mapRef}></div>

                            {/* MAP LEGEND OVERLAY */}
                            <div style={{ position: 'absolute', bottom: '24px', left: '24px', background: 'rgba(11, 15, 25, 0.92)', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '8px', padding: '8px 12px', zIndex: 100, fontSize: '10px', color: '#E5E7EB' }}>
                                <div style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontWeight: 'bold', marginBottom: '4px' }}>MAP LEGEND</div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '2px' }}>
                                    <span style={{ width: '10px', height: '10px', background: '#ef4444', borderRadius: '2px', display: 'inline-block' }}></span> Critical Hotspot (&ge;75% Risk)
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '2px' }}>
                                    <span style={{ width: '10px', height: '10px', background: '#f59e0b', borderRadius: '2px', display: 'inline-block' }}></span> High Risk Corridor (55%-74%)
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '2px' }}>
                                    <span style={{ width: '10px', height: '10px', background: '#eab308', borderRadius: '2px', display: 'inline-block' }}></span> Medium Risk (35%-54%)
                                </div>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginTop: '4px', borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '4px' }}>
                                    <span style={{ width: '6px', height: '6px', background: '#ef4444', borderRadius: '50%', border: '1px solid #fff', display: 'inline-block' }}></span> 📍 Predicted Pothole Formation Dots
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: ML DIAGNOSTICS & TOP HOTSPOT RANKINGS */}
                        <div class="sidebar-card">
                            
                            {/* FEATURE IMPORTANCE SECTION */}
                            <div>
                                <div class="section-title">
                                    <span>📊 ML FEATURE IMPORTANCE</span>
                                </div>
                                <div style={{ fontSize: '11px', color: '#9CA3AF', marginBottom: '10px' }}>
                                    GradientBoostingClassifier Feature Weights:
                                </div>
                                {modelInfo && modelInfo.feature_importances && Object.entries(modelInfo.feature_importances).map(([feat, pct]) => {
                                    let barColor = '#00F2FE';
                                    if (feat.includes('Traffic')) barColor = '#3b82f6';
                                    else if (feat.includes('Weather')) barColor = '#a855f7';
                                    else if (feat.includes('Road')) barColor = '#10b981';

                                    return (
                                        <div key={feat} class="feature-bar-row">
                                            <div class="feature-bar-header">
                                                <span>{feat}</span>
                                                <b style={{ color: barColor }}>{pct}%</b>
                                            </div>
                                            <div class="feature-bar-bg">
                                                <div class="feature-bar-fill" style={{ width: `${pct}%`, background: barColor }}></div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* TOP 30-DAY PREDICTED HOTSPOTS TABLE */}
                            <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
                                <div class="section-title">
                                    <span>🚨 TOP 30-DAY FUTURE HOTSPOTS</span>
                                </div>
                                <div class="table-container">
                                    <table class="hotspot-table">
                                        <thead>
                                            <tr>
                                                <th>GRID ID / CORRIDOR</th>
                                                <th>RISK %</th>
                                                <th>PREVENTIVE ACTION</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {hotspots.filter(h => {
                                                if (filterRisk === 'CRITICAL' && h.risk_level !== 'CRITICAL') return false;
                                                if (filterRisk === 'HIGH' && !['CRITICAL', 'HIGH'].includes(h.risk_level)) return false;
                                                if (searchQuery.trim() !== '') {
                                                    const q = searchQuery.toLowerCase();
                                                    return h.grid_id.toLowerCase().includes(q) || h.corridor.toLowerCase().includes(q);
                                                }
                                                return true;
                                            }).slice(0, 15).map(h => {
                                                const isSelected = selectedCell && selectedCell.grid_id === h.grid_id;
                                                const isDispatched = dispatchedMap[h.grid_id];

                                                return (
                                                    <tr 
                                                        key={h.grid_id} 
                                                        style={{ background: isSelected ? 'rgba(0, 242, 254, 0.1)' : 'transparent', cursor: 'pointer' }}
                                                        onClick={() => setSelectedCell(h)}
                                                    >
                                                        <td>
                                                            <div style={{ fontWeight: 'bold', color: '#00F2FE' }}>{h.grid_id}</div>
                                                            <div style={{ color: '#9CA3AF', fontSize: '10px' }}>{h.corridor}</div>
                                                        </td>
                                                        <td>
                                                            <span class={`risk-badge badge-${h.risk_level.toLowerCase()}`}>
                                                                {h.predicted_risk_pct}%
                                                            </span>
                                                        </td>
                                                        <td>
                                                            {isDispatched ? (
                                                                <span class="btn-dispatched-active">
                                                                    ✅ {isDispatched.woCode || 'DISPATCHED'}
                                                                </span>
                                                            ) : (
                                                                <button 
                                                                    class="btn-dispatch"
                                                                    onClick={(e) => { e.stopPropagation(); setPreDispatchTarget(h); }}
                                                                >
                                                                    ⚡ PRE-DISPATCH
                                                                </button>
                                                            )}
                                                            <button
                                                                class="btn-3d-demo"
                                                                onClick={(e) => { e.stopPropagation(); setShow3DTarget(h); }}
                                                                title="Inspect 3D Pothole Demo Dots"
                                                            >
                                                                💎 3D
                                                            </button>
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* SELECTED CELL DETAILS FOOTER */}
                            {selectedCell && (
                                <div style={{ background: 'rgba(15, 23, 42, 0.9)', border: '1px solid rgba(0,242,254,0.3)', borderRadius: '8px', padding: '12px' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
                                        <div style={{ fontFamily: 'Orbitron', color: '#00F2FE', fontSize: '11px', fontWeight: 'bold' }}>
                                            📌 {selectedCell.grid_id} INSPECTION
                                        </div>
                                        <button
                                            onClick={() => setShow3DTarget(selectedCell)}
                                            style={{ background: 'rgba(168, 85, 247, 0.2)', color: '#a855f7', border: '1px solid #a855f7', borderRadius: '4px', padding: '2px 6px', fontSize: '10px', fontFamily: 'Orbitron', cursor: 'pointer' }}
                                        >
                                            💎 Open 3D Demo Dots View
                                        </button>
                                    </div>
                                    <div style={{ fontSize: '11px', color: '#E5E7EB', marginBottom: '4px' }}>
                                        {selectedCell.risk_statement}
                                    </div>
                                    <div style={{ fontSize: '10px', color: '#9CA3AF' }}>
                                        Key Risk Factors: <b>{selectedCell.risk_factors.join(', ')}</b>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>

                    {/* PRE-DISPATCH MODAL */}
                    {preDispatchTarget && (
                        <PreDispatchModal
                            hotspot={preDispatchTarget}
                            onClose={() => setPreDispatchTarget(null)}
                            onDispatchSuccess={handleDispatchSuccess}
                        />
                    )}

                    {/* 3D POTHOLE DEMO DOTS MODAL */}
                    {show3DTarget && (
                        <Hotspot3DModal
                            hotspot={show3DTarget}
                            onClose={() => setShow3DTarget(null)}
                        />
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('app-root')).render(<PredictiveHotspotsApp />);
    </script>
    {% endraw %}

</body>

</html>
